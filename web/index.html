<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Companion</title>
<link rel="icon" href="/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Nunito:wght@600;700;800;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Companion looks like a window from the game: Maple's sky, its window frames with a title strip,
   CHARACTER STAT's colored label cells, the inventory's tabs and slots, and the HUD's orange level.
   Colors keep the game's meanings: pink is you, blue is stats, orange is level and progress, green is
   a deal, red is overpriced; each always comes with words. */
:root{
  --sky:#C9DEF4; --win:#FBFAF6; --strip:#FFFFFF; --cell:#ECE8DE; --rim:#7E97B7; --rim-soft:#C6D3E3;
  --ink:#1D2433; --muted:#525C6F; --pink:#C2306A; --blue:#3364AD; --olive:#B5C742; --olive-ink:#283006;
  --tile:#C8620A; --amber:#F2A541; --gold-ink:#4A2600; --slot:#FFFFFF; --slot2:#E8EEF5; --inv:#DCE5EF;
  --good:#1D7543; --goodbg:#DCF1E3; --bad:#B03826; --badbg:#FBE2DD; --warn:#865500; --warnbg:#FFEFD0;
  --hud:#252E3F; --hud2:#1A2130; --hud-ink:#EEF3FA; --hud-muted:#AEB9CB; --hud-rim:#46536C;
  --tab:#C3CFDD; --tab2:#AEBCCE; --tab-ink:#384458; --tab-on:#C2306A;
  /* one color per price source, so a number is never mistaken for the other site's */
  --src-msc:#2B6FD0; --src-cozy:#7A3FD0;
  --bar:#2F3747; --shadow:rgba(38,58,90,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --sky:#111A27; --win:#18222F; --strip:#1F2B3B; --cell:#243245; --rim:#3B5272; --rim-soft:#2C3D55;
    --ink:#E7EDF6; --muted:#9FADC2; --pink:#E25C90; --blue:#7FA9E8; --olive:#9DB33A; --olive-ink:#141A02;
    --tile:#D06D10; --amber:#F2A541; --gold-ink:#3A1F00; --slot:#24344A; --slot2:#1C2A3C; --inv:#152131;
    --good:#63D295; --goodbg:#12301F; --bad:#FF8A76; --badbg:#3A1913; --warn:#FFC14D; --warnbg:#33260C;
    --hud:#0D131C; --hud2:#151D2A; --hud-ink:#EEF3FA; --hud-muted:#9AA7BC; --hud-rim:#33415A;
    --tab:#22303F; --tab2:#1B2734; --tab-ink:#B4C1D3; --tab-on:#C2306A;
    --src-msc:#7FB2F0; --src-cozy:#C79BFF;
    --bar:#0C121B; --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font:600 16px/1.5 "Nunito",ui-rounded,system-ui,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.px{font-family:"DotGothic16","Nunito",sans-serif}

/* the HUD: your character, like the game's status bar. One row on a wide screen, two when the
   dashboard sits in a narrow window beside the game */
.hud{display:grid;grid-template-columns:auto minmax(130px,1.1fr) minmax(150px,1.5fr) minmax(120px,1fr) 72px auto auto;
  grid-template-areas:"lv who map money acc brand help";gap:4px 16px;align-items:center;
  background:var(--hud);color:var(--hud-ink);border:1px solid #11161F;border-radius:10px;padding:8px 10px 8px 12px;box-shadow:0 2px 0 var(--shadow)}
.hud .lv{grid-area:lv} .hud .who{grid-area:who} .hud .where{grid-area:map} .hud .money{grid-area:money} .hud .accb{grid-area:acc}
.hud label,.hud .lbl{display:block;font-size:.74rem;font-weight:800;color:var(--hud-muted);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud input,.hud select{width:100%;min-width:0;color:var(--hud-ink);background:rgba(0,0,0,.28);border:1px solid var(--hud-rim);border-radius:6px;padding:4px 8px;font-weight:800}
.hud select option{color:#1D2433}
.lv{display:flex;align-items:center;gap:8px}
.lv b{font:400 1.5rem/1 "DotGothic16",sans-serif;letter-spacing:.02em}
.lv input{width:3.1em;text-align:center;font:400 1.5rem/1 "DotGothic16",sans-serif;color:#fff;background:var(--tile);border:1px solid #F7B062;border-radius:5px;padding:3px 4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.where .map{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.9}
.coin{display:flex;align-items:center;gap:6px}
.coin::before{content:"";width:13px;height:13px;flex:none;border-radius:50%;background:#E9A923;box-shadow:inset -2px -2px 0 #B37812,0 0 0 1px #8A5A0A}
.brand{grid-area:brand;display:flex;align-items:center;gap:8px;font:400 1.05rem "DotGothic16",sans-serif;color:var(--hud-muted);white-space:nowrap}
.brand img{width:34px;height:34px;flex:none}
.help{grid-area:help;width:38px;height:38px;border-radius:50%;border:1px solid var(--hud-rim);background:transparent;color:var(--hud-ink);
  font:400 1.2rem/1 "DotGothic16",sans-serif;cursor:pointer}
.help:hover{background:rgba(255,255,255,.1)}
@media (max-width:1060px){.brand{display:none}.hud{grid-template-columns:auto minmax(120px,1.1fr) minmax(140px,1.5fr) minmax(110px,1fr) 64px auto;grid-template-areas:"lv who map money acc help"}}
@media (max-width:760px){.hud{grid-template-columns:auto minmax(0,1fr) minmax(0,.8fr) auto;grid-template-areas:"lv who money help" "lv map acc help";gap:4px 10px}}

/* tabs, like the inventory's Equip / Use / Etc tabs on their red rule; all of them fit beside the game */
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:3px;padding:10px 4px 0;margin:0 -4px 12px;overflow-x:auto;scrollbar-width:none;background:var(--sky);border-bottom:3px solid var(--tab-on)}
.tabs button{flex:0 1 auto;white-space:nowrap;font-weight:800;font-size:.93rem;color:var(--tab-ink);background:var(--tab);border:1px solid var(--rim);border-bottom:0;border-radius:7px 7px 0 0;padding:7px 15px 5px;cursor:pointer;min-height:36px}
.tabs button:hover{color:var(--ink);background:var(--tab2)}
.tabs button[aria-selected="true"]{color:#fff;background:var(--tab-on);border-color:var(--tab-on)}
@media (max-width:640px){.tabs{gap:2px}.tabs button{flex:1 1 auto;padding:6px 5px 4px;font-size:.84rem}}

/* windows */
.card{background:var(--win);border:1px solid var(--rim);border-radius:8px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--strip),0 2px 0 var(--shadow)}
.card h3{margin:0;font-size:1.04rem;font-weight:900;line-height:1.3}
.win{padding:0;overflow:hidden}
.win > .title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;background:var(--strip);border-bottom:1px solid var(--rim-soft);font:400 .98rem "DotGothic16",sans-serif}
.win > .title small{font:800 .8rem "Nunito",sans-serif;color:var(--muted)}
.win > .body{padding:12px 14px}
.win > .body > p,.risk{max-width:78ch}
h2{font:400 1.12rem "DotGothic16",sans-serif;margin:22px 2px 8px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.note{color:var(--muted);font-size:.93rem;margin:0 2px 14px;max-width:72ch}
.sub{color:var(--muted);font-size:.87rem;font-weight:700}
.empty{background:var(--win);border:1px dashed var(--rim);border-radius:8px;padding:16px 18px;color:var(--muted);font-weight:800}
.soon{opacity:.82;border-style:dashed}

/* CHARACTER STAT's label cells */
.stat{display:grid;grid-template-columns:minmax(64px,auto) 1fr;gap:4px 5px;margin:0}
.stat dt{display:flex;align-items:center;font:400 .84rem "DotGothic16",sans-serif;color:#fff;background:var(--pink);border-radius:4px;padding:3px 9px}
.stat dt.b{background:var(--blue)} .stat dt.o{background:var(--olive);color:var(--olive-ink)}
.stat dd{margin:0;background:var(--cell);border-radius:4px;padding:3px 10px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.stat .gap{grid-column:1/-1;height:6px}
@media (prefers-color-scheme: dark){.stat dt{color:#22040F}.stat dt.b{color:#0E1A2C}.stat dt.o{color:var(--olive-ink)}}

.chips{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.chips li{background:var(--cell);border-radius:5px;padding:2px 8px;font-size:.84rem;font-weight:800;color:var(--muted)}
.chips .good{background:var(--goodbg);color:var(--good)} .chips .bad{background:var(--badbg);color:var(--bad)} .chips .warn{background:var(--warnbg);color:var(--warn)}
img.icon{width:36px;height:36px;object-fit:contain;image-rendering:pixelated;flex:none}
.mobs{display:grid;gap:4px;margin-top:8px}
.mob{display:flex;align-items:center;gap:8px;background:var(--cell);border-radius:6px;padding:2px 8px;min-height:36px;font-size:.94rem}
.mob img{width:28px;height:28px;object-fit:contain;image-rendering:pixelated}

/* buttons: the game's orange action button, plain ones for the rest */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.btn{font-weight:800;font-size:.93rem;color:var(--blue);background:var(--strip);border:1px solid var(--rim);border-radius:6px;padding:8px 14px;min-height:40px;cursor:pointer;box-shadow:0 1px 0 var(--rim-soft)}
.btn:hover{border-color:var(--blue)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{color:var(--gold-ink);background:var(--amber);border-color:#C77A1C;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.primary:hover{background:#F7B65E}
.btn.on{color:var(--good);background:var(--goodbg);border-color:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:32px;padding:3px 10px}

.verdict{font-weight:900;padding:2px 8px;border-radius:5px;font-size:.84rem;white-space:nowrap}
.v-snipe,.v-npc{background:var(--goodbg);color:var(--good)} .v-fair,.v-info{background:var(--cell);color:var(--muted)}
.v-pricey,.v-check,.v-split{background:var(--warnbg);color:var(--warn)} .v-over{background:var(--badbg);color:var(--bad)} .v-sold{background:var(--cell);color:var(--muted)}
/* a price source's own color: the label is the source, the number stays bright */
.src{display:inline-flex;align-items:baseline;gap:4px;font-weight:900}
.src i{font-style:normal;font-weight:800;font-size:.86em;opacity:.95}
.src-msc,.foot a.src-msc{color:var(--src-msc)} .src-cozy,.foot a.src-cozy{color:var(--src-cozy)}
.tag{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;border:1px solid var(--rim);border-radius:6px;overflow:hidden}
.tag div{padding:6px 10px} .tag span{display:block;font-size:.76rem;font-weight:800}
.tag b{font-size:1.25rem;font-weight:900}
.tag .srcpair{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:1.05rem}
.tag .srcpair .src{display:inline-flex;font-size:inherit}
.tag .buy{background:var(--goodbg);color:var(--good)} .tag .sell{background:var(--warnbg);color:var(--warn);border-left:1px solid var(--rim)}

/* progress, like the HUD's EXP bar */
.prog{margin-top:7px} .prog .lbl{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;font-weight:800}
.bar{height:9px;border-radius:3px;background:var(--bar);border:1px solid #0F141C;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--amber)} .bar i.full{background:#2E9F59}

/* Now: the status line and the open shop's rows */
.status{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-weight:800;color:var(--muted);font-size:.92rem}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.gstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.gstrip div{background:var(--cell);border-radius:6px;padding:6px 4px}
.gstrip b{display:block;font-size:1.15rem}
.gstrip span{font-size:.78rem;color:var(--muted);font-weight:700}
.mine{color:var(--good)}
.gspark{margin-top:10px}
.spark{display:block;width:100%;height:34px}
.spark rect{fill:var(--cell)} .spark rect.on{fill:var(--amber)}
.gspark .sub{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:.8rem}
.gmaps{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
.gmaps th{font-size:.76rem;color:var(--muted);text-align:left;font-weight:800;padding:0 6px 2px}
.gmaps td{padding:3px 6px;background:var(--cell);font-weight:700} .gmaps tr td:first-child{border-radius:4px 0 0 4px}
.gmaps tr td:last-child{border-radius:0 4px 4px 0;text-align:right;font-weight:900;color:var(--good)} .gmaps th:last-child{text-align:right}
.gmaps tbody tr{border-top:3px solid var(--win)}
.chip{display:inline-block;background:var(--cell);color:var(--muted);border-radius:5px;padding:2px 8px;font-size:.84rem;font-weight:800}
.chip.good{background:var(--goodbg);color:var(--good)} .chip.warn{background:var(--warnbg);color:var(--warn)}
.skh{margin:6px 0 4px;font-size:.9rem}
.sk{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:4px}
.sk li{display:flex;gap:8px;align-items:center}
.sk .grow{display:grid;min-width:0}
.sk .grow span{font-size:.82rem}
.star{border:0;background:none;font-size:1.2rem;cursor:pointer;color:var(--warn);min-width:32px;min-height:32px}
.sales{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.sales li{display:flex;gap:8px;align-items:baseline;font-size:.9rem}
.sales b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sales .price{font-weight:800;color:var(--good)}
.status span:last-child{flex:1;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px var(--goodbg)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--badbg)}
@media (prefers-reduced-motion:no-preference){.dot.on{animation:blink 1.8s ease-in-out infinite}@keyframes blink{50%{opacity:.4}}}
.live{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.live > div{display:grid;gap:14px;min-width:0}
@media (max-width:820px){.live{grid-template-columns:1fr}}
.shot{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#000;border-bottom:1px solid var(--rim-soft)}
.seen{padding:8px 12px 10px}
.shop{display:grid;gap:4px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--cell);border-radius:6px;padding:5px 10px 5px 5px}
.srow.sold{opacity:.55}
.slot{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:5px;background:var(--slot);border:1px solid var(--rim-soft);display:grid;place-items:center}
.slot img{width:78%;height:78%;object-fit:contain;image-rendering:pixelated}
.srow .price{text-align:right;font-weight:900}
.srow .price .sub{display:block}
.srow .price .srcline{display:flex;gap:10px;justify-content:flex-end;margin-top:3px;font-weight:800}

/* list and details side by side, like the game's Quest and Skill windows: each side scrolls on
   its own (fitted to the screen by fitPanes), so a tab never needs the page to scroll */
.md{display:grid;grid-template-columns:minmax(260px,350px) minmax(0,1fr);gap:14px;align-items:start}
.md .master{display:grid;gap:3px;align-content:start;overflow:auto;background:var(--win);border:1px solid var(--rim);border-radius:8px;padding:6px;box-shadow:inset 0 0 0 1px var(--strip),0 2px 0 var(--shadow)}
.md .detail{overflow:auto;border-radius:8px;min-width:0}
.md .master > *{min-width:0}
.md .master{overflow-x:hidden}
.mob .grow{flex:1;min-width:0}
/* stacked beside the game: the list keeps to its own scroll, so the chosen one shows under it */
@media (max-width:820px){.md{grid-template-columns:1fr}.md .master{max-height:38vh}}
.vtab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;cursor:pointer;font-weight:700;min-height:44px}
.vtab:hover{background:var(--cell)}
.vtab[aria-selected="true"]{background:var(--cell);border-color:var(--tab-on);box-shadow:inset 4px 0 0 var(--tab-on)}
.vtab .grow{flex:1;min-width:0}
.vtab b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtab small{display:block;font-size:.8rem;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtab .rank{font:400 1.05rem "DotGothic16",sans-serif;color:var(--muted);min-width:1.4em;text-align:center}
.vtab .score{text-align:right;font-weight:900;color:var(--good);line-height:1.15;white-space:nowrap}
.vtab .score small{color:var(--muted);font-size:.72rem}
.vtab .lv{text-align:right;font-weight:900;white-space:nowrap}
.vtab .lv small{display:inline;color:var(--muted)}
.vgroup{font:400 .95rem "DotGothic16",sans-serif;color:var(--muted);padding:8px 8px 2px}
.mobtable{width:100%;border-collapse:separate;border-spacing:0 3px;margin-top:8px;font-size:.93rem}
.mobtable th{font-size:.78rem;color:var(--muted);text-align:left;font-weight:800;padding:0 8px}
.mobtable td{background:var(--cell);padding:3px 8px;font-weight:700}
.mobtable td:first-child{border-radius:6px 0 0 6px;width:40px} .mobtable td:last-child{border-radius:0 6px 6px 0}
.mobtable img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated;display:block}
.mobtable small{display:block;color:var(--muted);font-weight:700;font-size:.78rem}
.equip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.etile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;align-items:center;text-align:left;color:var(--ink);background:var(--strip);border:1px solid var(--rim-soft);border-radius:7px;padding:6px;cursor:pointer;min-height:58px}
.etile:hover{border-color:var(--blue)}
.etile[aria-selected="true"]{border-color:var(--tab-on);box-shadow:inset 0 0 0 1px var(--tab-on)}
.etile .slot{grid-row:span 3}
.etile .k{font:400 .9rem "DotGothic16",sans-serif;color:var(--muted)}
.etile b{font-size:.88rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.etile small{font-size:.8rem;font-weight:900;color:var(--good)}
.lvbar{height:5px;border-radius:3px;background:var(--bar);overflow:hidden;margin-top:3px}
.lvbar i{display:block;height:100%;background:var(--amber)}
.stepper{display:inline-flex;align-items:center;gap:6px}
#view .stepper input{width:64px;text-align:center}
.range{position:relative;height:10px;border-radius:5px;margin:8px 0 3px;border:1px solid var(--rim-soft);
  background:linear-gradient(90deg,var(--goodbg) 0 25%,var(--cell) 25% 50%,var(--warnbg) 50% 75%,var(--badbg) 75%)}
.range i{position:absolute;top:-5px;width:4px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.ranges{display:flex;justify-content:space-between;font-size:.76rem;font-weight:800;color:var(--muted)}
.okc{color:var(--good)}
.qsteps{margin:0;padding-left:22px;display:grid;gap:3px;font-weight:700}
.qsteps li::marker{font-family:"DotGothic16",sans-serif;color:var(--muted)}
.task{margin:12px 0 0;padding:10px 12px;border-left:4px solid var(--blue);background:var(--cell);border-radius:0 6px 6px 0;font-weight:700}
.task b{display:block;font:400 .95rem "DotGothic16",sans-serif;color:var(--muted);margin-bottom:2px}
/* the quest guide's steps: done, the one to do now, and what comes after */
.gsteps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:5px}
.gsteps li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:2px 8px;align-items:start;padding:7px 8px;border-radius:6px;background:var(--cell);font-weight:800}
.gsteps .mark{font:400 1rem/1.4 "DotGothic16",sans-serif;text-align:center;color:var(--muted)}
.gsteps .ghow{grid-column:2 / -1;font-size:.85rem;color:var(--muted);font-weight:700}
.gsteps .cnt{white-space:nowrap}
.gsteps li.done{opacity:.6} .gsteps li.done .mark{color:var(--good)}
.gsteps li.now{background:var(--warnbg);box-shadow:inset 4px 0 0 var(--warn)} .gsteps li.now .mark{color:var(--warn)}
.gsteps .tick{grid-column:2 / -1;justify-self:start;margin-top:4px}
.btable td{vertical-align:middle} .btable tr.done td{opacity:.6}
.btable tr.cur td{background:var(--warnbg)} .btable td:first-child{width:auto;white-space:nowrap;font:400 1rem "DotGothic16",sans-serif}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0}
.kv2 dt{color:var(--muted);font-weight:800;font-size:.88rem} .kv2 dd{margin:0;font-weight:700}

/* two columns of windows on a wide screen, one on a narrow one */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:10px;align-items:start}

/* Gear, like the equipment window: a slot per window, the best pick in full, the rest one line each */
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.pick h3{font-size:1.02rem}
.pr{text-align:right;line-height:1.25;white-space:nowrap}
.pr b{display:block;font-size:1.12rem;font-weight:900;color:var(--good)}
.pr small{display:block;font-size:.76rem;font-weight:800;color:var(--muted)}
.pr .srcmini{display:flex;gap:8px;justify-content:flex-end}
.alts{margin-top:10px;border-top:1px solid var(--rim-soft);padding-top:6px;display:grid;gap:2px}
.alt summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 6px 3px 3px;border-radius:5px;cursor:pointer;list-style:none}
.alt summary::-webkit-details-marker{display:none}
.alt summary:hover,.alt[open] summary{background:var(--cell)}
.alt .nm{min-width:0;line-height:1.25}
.alt .nm b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt .nm small{display:block;font-size:.8rem;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt .pp{font-weight:900;color:var(--good);min-width:4.5em;text-align:right}
.alt .more{padding:2px 6px 8px 44px}
.alt .more .chips{margin-top:4px}
.soonlbl{font-size:.8rem;font-weight:800;color:var(--warn);margin:8px 3px 2px}

/* Shops: every item seen in player shops, like the inventory window */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px;background:var(--inv);border:1px solid var(--rim);border-radius:8px;padding:8px}
.islot{position:relative;aspect-ratio:1;border-radius:6px;background:var(--slot);border:1px solid #A7B7CB;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);cursor:pointer;padding:0;display:grid;place-items:center;color:var(--muted)}
@media (prefers-color-scheme: dark){.islot{border-color:#3B5272;box-shadow:inset 0 0 0 2px rgba(255,255,255,.04)}}
.islot:hover{border-color:var(--blue)}
.islot img{width:68%;height:68%;object-fit:contain;image-rendering:pixelated}
.islot .qty{position:absolute;left:4px;bottom:1px;font:400 .85rem "DotGothic16",sans-serif;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 2px #000}
.islot .tagv{position:absolute;right:3px;top:3px;width:10px;height:10px;border-radius:2px;border:1px solid #fff}
.islot[data-v=snipe],.islot[data-v=npc]{border:2px solid var(--good)} .islot[data-v=over]{border:2px solid var(--bad)} .islot[data-v=pricey]{border:2px solid var(--warn)}
.tagv[data-v=snipe],.tagv[data-v=npc]{background:var(--good)} .tagv[data-v=over]{background:var(--bad)} .tagv[data-v=pricey],.tagv[data-v=split]{background:var(--warn)} .tagv[data-v=fair],.tagv[data-v=info]{background:var(--muted)}
.islot[aria-pressed="true"]{outline:3px solid var(--pink);outline-offset:1px}
/* an item with no picture (Cash Shop items): its whole name, small, instead of a cut-off word */
.islot .noimg{font-size:.64rem;line-height:1.15;font-weight:800;padding:0 5px;text-align:center;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.islot .noimg[hidden]{display:none}
.filters .tagv{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0;border:1px solid rgba(255,255,255,.85)}
.asof{font-size:.8rem;font-weight:700;color:var(--muted)}
.shop .asof{margin-top:8px;text-align:right}
.filters{display:flex;gap:3px;flex-wrap:wrap;margin:0 0 -1px;padding-left:6px}
.filters button{font-weight:800;font-size:.86rem;color:var(--tab-ink);background:var(--tab);border:1px solid var(--rim);border-bottom:0;border-radius:6px 6px 0 0;padding:4px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{color:#fff;background:var(--tab-on);border-color:var(--tab-on)}

/* routes and search */
/* a map picture of any shape (5x wider than tall, or 4x taller than wide) in a box of one size */
.mapview{position:relative;height:clamp(240px,44vh,540px);overflow:hidden;border:1px solid var(--rim);border-radius:6px;margin-top:10px;background:#000;touch-action:none;cursor:grab;user-select:none}
.mapview.drag{cursor:grabbing}
.mapview .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.mapview img{display:block;max-width:none;pointer-events:none}
.mapview svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.mapview .stage,.mapview .mapctl{opacity:0;transition:opacity .2s}
.mapview.ready .stage,.mapview.ready .mapctl{opacity:1}
.mapview .maploading{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-weight:700}
.mapview.ready .maploading{display:none}
.mapctl{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.mapctl button{min-width:34px;height:34px;padding:0 10px;font-weight:900;color:#fff;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.35);border-radius:6px;cursor:pointer}
.mapctl button:hover{border-color:#fff}
.ring{fill:none;stroke:#2EE59D;stroke-width:4px}
@media (prefers-reduced-motion:no-preference){.ring{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{stroke-width:9px;opacity:.6}}}
.big{font:400 2.4rem/1 "DotGothic16",sans-serif;color:var(--good)}
.results{display:grid;gap:5px;margin-top:6px}
.results button,.steps button{font-weight:800;text-align:left;color:var(--ink);background:var(--cell);border:1px solid transparent;border-radius:6px;padding:8px 10px;cursor:pointer}
.results button:hover,.steps button:hover{border-color:var(--blue)}
.steps{display:grid;gap:5px;margin-top:8px}
.steps button.cur{border-color:var(--good);background:var(--goodbg)}
.steps button.done{opacity:.55}
.searchbox{display:grid;gap:4px;margin-bottom:6px}
#view input:not([type=checkbox]),#view select{width:100%;min-width:0;font-weight:800;color:var(--ink);background:var(--strip);border:1px solid var(--rim);border-radius:6px;padding:7px 9px}
.plan{width:76px;flex:none;text-align:center}
.toggle{display:flex;gap:10px;align-items:flex-start;font-weight:800;cursor:pointer}
.toggle input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--pink)}
.risk{background:var(--warnbg);color:var(--warn);border-radius:6px;padding:10px 12px;font-weight:700;font-size:.92rem;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
details.more summary{cursor:pointer;font-weight:800;color:var(--muted)}
/* Now: what matters mid-game, on one screen. The route and the open shop on the left, what to do
   next and the quest counts on the right */
.now{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;align-items:start}
.now > div{display:grid;gap:12px;min-width:0}
.now.one{grid-template-columns:minmax(0,640px)}
@media (max-width:860px){.now{grid-template-columns:1fr}}
.nx{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:42px}
.nx + .nx{margin-top:6px}
.nx .k{font:400 .84rem "DotGothic16",sans-serif;color:#fff;background:var(--pink);border-radius:4px;padding:4px 0;text-align:center}
.nx .k.b{background:var(--blue)} .nx .k.o{background:var(--olive);color:var(--olive-ink)}
@media (prefers-color-scheme: dark){.nx .k{color:#22040F}.nx .k.b{color:#0E1A2C}.nx .k.o{color:var(--olive-ink)}}
.nx .grow{min-width:0}
.nx .grow b,.nx .grow small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nx .grow small{font-size:.82rem;color:var(--muted);font-weight:700}
.way{display:flex;align-items:center;gap:12px}
.way .big{min-width:1.1em;text-align:center}
.hops{display:flex;gap:4px;margin-top:10px}
.hops i{flex:1;height:6px;border-radius:3px;background:var(--cell)} .hops i.done{background:var(--good)} .hops i.cur{background:var(--amber)}
.goal{margin-top:10px;padding:6px 10px;border-radius:6px;background:var(--warnbg);color:var(--warn)}
.goal.ok{background:var(--goodbg);color:var(--good)} .goal b{display:block} .goal small{font-weight:700}
.thumb{display:block;width:100%;max-width:460px;border-radius:6px;background:#000;margin-top:8px}
.status .btn{margin-left:auto}

/* first-run setup and the how-to, in Hebrew */
dialog.setup{width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--rim);border-radius:10px;
  background:var(--win);color:var(--ink);box-shadow:0 18px 50px rgba(10,20,40,.35);font:500 16px/1.6 "Rubik","Nunito",system-ui,sans-serif}
dialog.setup::backdrop{background:rgba(12,20,34,.6)}
/* over the whole dashboard while the game is too small to read right */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(12,20,34,.82)}
.gate[hidden]{display:none}
.gate .box{width:min(560px,100%);background:var(--win);color:var(--ink);border:2px solid var(--bad);border-radius:12px;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.gate h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;color:var(--bad);font-size:1.25rem}
.gate .size{font:400 1.6rem/1.2 "DotGothic16",sans-serif;margin:6px 0 10px}
.gate .size b{color:var(--bad)} .gate .size span{color:var(--good)}
.gate ol{margin:6px 0 14px;padding-inline-start:22px}
dialog.setup[open]{display:flex;flex-direction:column}
.setup .stitle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:var(--hud);color:var(--hud-ink)}
.setup .stitle b{font:400 1.08rem "DotGothic16",sans-serif}
.setup .sbody{padding:14px 20px 16px;overflow:auto}
.setup h2{font:700 1.2rem/1.3 "Rubik",sans-serif;margin:0 0 6px}
.setup h3{font:700 1rem "Rubik",sans-serif;margin:12px 0 5px}
.setup p{margin:0 0 8px}
.setup ul{margin:4px 0 0;padding-inline-start:20px;display:grid;gap:4px}
.setup li::marker{color:var(--tab-on)}
.setup .grid2{margin-top:6px}
.setup label.sub{display:block;margin-bottom:2px}
.setup input:not([type=checkbox]),.setup select{width:100%;min-width:0;font:inherit;font-weight:700;color:var(--ink);background:var(--strip);border:1px solid var(--rim);border-radius:6px;padding:7px 9px}
.setup .toggle{margin-top:8px;font-weight:600}
.setup .risk{font-weight:500}
.setup .sfoot{display:flex;gap:8px;align-items:center;padding:10px 20px;border-top:1px solid var(--rim-soft);background:var(--strip)}
.setup .sfoot .grow{flex:1}
.setup .btn{font-family:inherit;font-weight:700}
.steps3{display:flex;gap:5px} .steps3 i{width:22px;height:5px;border-radius:3px;background:var(--hud-rim)} .steps3 i.on{background:var(--amber)}
.checks{display:grid;gap:5px;margin-top:10px}
.check{padding:6px 10px;border-radius:6px;background:var(--cell);font-weight:600}
.check.ok{background:var(--goodbg);color:var(--good)} .check.warn{background:var(--warnbg);color:var(--warn)}
bdi{unicode-bidi:isolate}
.nw{white-space:nowrap}
.setup .stitle b{display:flex;align-items:center;gap:8px}
.setup .stitle img{image-rendering:pixelated}
/* the how-to: each part beside an inventory slot holding a game item */
.hslot{--s:40px;flex:none}
.hslot img{width:28px;height:28px;object-fit:contain}
.hows{display:grid;gap:6px}
.how{display:flex;gap:12px;align-items:flex-start;background:var(--strip);border:1px solid var(--rim-soft);border-radius:8px;padding:7px 12px 7px 10px;line-height:1.5}
.how b{display:block;font-size:1rem}
.how p{margin:0}
.how small{display:block;color:var(--muted);font-size:.86rem;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0 2px}
.tagline{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tagline .verdict{direction:ltr;font-family:"Nunito",sans-serif}
.htiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.htile{display:flex;gap:10px;align-items:center;background:var(--strip);border:1px solid var(--rim-soft);border-radius:8px;padding:4px 10px 4px 5px}
.htile > div{min-width:0}
.htile .tabname{display:inline-block;font:800 .82rem "Nunito",sans-serif;color:#fff;background:var(--tab-on);border-radius:5px 5px 0 0;padding:1px 9px;margin-bottom:2px}
.htile span{display:block;font-size:.9rem;line-height:1.35}
@media (max-width:420px){.htiles{grid-template-columns:1fr}}
.tips{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:6px;line-height:1.45}
.tips li{display:flex;gap:12px;align-items:center}
.tips .keys{flex:none;display:flex;gap:4px;min-width:96px;justify-content:center}
kbd{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;font:400 .95rem "DotGothic16",sans-serif;color:var(--ink);
  background:var(--strip);border:1px solid var(--rim);border-bottom-width:3px;border-radius:5px}
kbd.wide{font-size:.82rem}

.foot{margin-top:26px;color:var(--muted);font-size:.85rem}
.foot a{color:var(--blue);font-weight:800}

/* ---- the redesign's shared pieces: game icons, a game window, the game's tooltip, pages, full height ---- */
.gi{image-rendering:pixelated;object-fit:contain;flex:none;vertical-align:middle}
.tabs button{display:inline-flex;align-items:center;gap:6px}
.tabs button .gi{margin:-4px 0}
.win > .title > span{display:inline-flex;align-items:center;gap:7px}
/* a full-height tab: the page never scrolls, the view takes what's left under the HUD and the tabs */
body[data-full] .wrap{height:100vh;display:flex;flex-direction:column;padding-bottom:10px}
body[data-full] #view{flex:1;min-height:0}
body[data-full] .tabs{margin-bottom:8px}
@media (max-width:760px),(max-height:600px){
  body[data-full] .wrap{height:auto;display:block}
}
/* a window in the game's style: blue rim, a white title strip in pixel caps, grey tabs on a red rule */
.gwin{display:flex;flex-direction:column;min-height:0;background:linear-gradient(#E9EFF6,#DCE5EF);border:1px solid #7E97B7;border-radius:7px;padding:3px;box-shadow:inset 0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.18);color:#1D2433}
.gwin > *:not(.gtitle){background:#fff;margin-left:2px;margin-right:2px}
.gwin > :last-child{border-radius:0 0 5px 5px;margin-bottom:2px}
.gtitle{margin:2px 2px 0;padding:5px 6px 5px 10px;background:#fff;border:1px solid #9FB3CB;border-radius:5px 5px 0 0;font:400 13px "DotGothic16",sans-serif;color:#111;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
.gx{width:18px;height:18px;border-radius:3px;background:linear-gradient(#6FB6F5,#2C7AD6);box-shadow:inset 0 0 0 1px #1C5BA6,inset 0 0 0 2px rgba(255,255,255,.35);position:relative;flex:none}
.gx::before,.gx::after{content:"";position:absolute;left:4px;right:4px;top:8px;height:2px;background:#fff;border-radius:1px}
.gx::before{transform:rotate(45deg)}.gx::after{transform:rotate(-45deg)}
.gtabs{display:flex;gap:3px;padding:6px 8px 0;border-bottom:3px solid #D23A3A}
.gtabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font:800 13px "Nunito",sans-serif;color:#525C6F;background:linear-gradient(#F3F5F8,#DCE2EA);border:1px solid #B9C4D2;border-bottom:0;border-radius:7px 7px 0 0;padding:6px 6px 5px;cursor:pointer}
.gtabs button:hover{background:#fff}
.gtabs button small{font-weight:900;opacity:.7}
.gtabs button[aria-selected="true"]{color:#fff;background:linear-gradient(#EE6A7E,#D23A50);border-color:#B42A3E;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.gtabs button img{width:18px;height:18px;image-rendering:pixelated;margin:-3px 0}
/* the game's item tooltip */
#tip{position:fixed;display:none;z-index:50;width:330px;padding:12px 14px;background:rgba(27,32,72,.985);border:1px solid #5C6BB0;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.45);color:#fff;font:700 15px/1.35 "Nunito",sans-serif;pointer-events:none}
#tip .tname{display:flex;align-items:center;gap:8px;font-size:1.25rem;font-weight:900;margin-bottom:8px}
#tip .tname i{width:9px;height:9px;border-radius:50%;background:#7FB2F0;flex:none}
#tip .ttop{display:flex;gap:14px;align-items:center}
#tip .timg{width:100px;height:100px;background:#D5D6DC;border-radius:4px;display:grid;place-items:center;flex:none}
#tip .timg img{width:76px;height:76px;image-rendering:pixelated;object-fit:contain}
#tip hr{border:0;border-top:1px solid #4A5590;margin:8px 0}
#tip ul{list-style:none;margin:0;padding:0}
#tip li{padding-left:18px;position:relative;font-weight:600}
#tip li::before{content:"\2726";position:absolute;left:0;color:#F2A541;font-size:.8em;top:2px}
#tip .tsub{color:#9AA3D0;font-size:.78rem}
/* pages: the game's orange arrow buttons */
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px;font-weight:800;color:var(--muted)}
.pager:empty{display:none}
.pager b{color:var(--ink)}
.pg{width:30px;height:26px;border-radius:5px;border:1px solid #C77A1C;background:linear-gradient(#FBC46E,#F2A541);color:#4A2600;font-size:.8rem;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.pg:disabled{opacity:.35;cursor:default}
.pfit{min-height:0;overflow:hidden}

/* ---- Now ---- */
.now2{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
.now2 > .colL{display:flex;flex-direction:column;gap:10px;min-height:0}
.now2 .win{margin:0}
.now2 .win > .title{padding:4px 10px}
.now2 .win > .body{padding:8px 12px}
.gcard,.now2 > .colL > .win:first-child{flex:1;display:flex;flex-direction:column;min-height:0}
.gcard > .body{flex:1;display:flex;flex-direction:column;min-height:0}
.gcard .gstrip b{font-size:1.05rem}.gcard .gstrip div{padding:3px 4px}
.gcard .prog{margin-top:5px}.gcard .prog .sub{margin:4px 0 0;font-size:.78rem}
.gcard .gspark{flex:1;display:flex;flex-direction:column;min-height:40px;margin-top:6px}
.gcard .gspark .spark{flex:1;height:auto;min-height:26px}
.gbtns{display:flex;gap:6px}
.btn.mini{min-height:24px;padding:1px 9px;font:800 .78rem "Nunito",sans-serif;display:inline-flex;align-items:center;gap:5px;color:var(--ink)}
.toggle.small{font-size:.78rem;margin:6px 0 0;gap:6px}
.toggle.small input{width:15px;height:15px;margin:0}
.dhead{display:flex;align-items:center;gap:7px;margin:8px 0 4px;font:400 .95rem "DotGothic16",sans-serif;color:var(--warn)}
.dhead.blue{color:var(--blue)}
.dhead .sub{font-family:"Nunito",sans-serif;margin-left:auto;font-size:.76rem}
.best{display:grid;gap:3px}
.bl{display:grid;grid-template-columns:22px minmax(0,1fr) auto 54px 40px;align-items:center;gap:8px;background:var(--cell);border-radius:5px;padding:2px 6px;min-height:28px}
.bl b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bl .sub{font-size:.74rem;white-space:nowrap}
.bl .eh{font-weight:900;color:var(--good);text-align:right}
.bl.here{background:var(--goodbg)}.hereb{font-size:.7rem;font-weight:900;color:var(--good);text-align:center}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font:400 .75rem "DotGothic16",sans-serif;color:#fff}
.rk.r1{background:#D9A21B;box-shadow:inset 0 -2px 0 #9A6F0A}.rk.r2{background:#9AA6B6;box-shadow:inset 0 -2px 0 #6C7787}.rk.r3{background:#B9733A;box-shadow:inset 0 -2px 0 #85501F}
.nxrow{display:grid;gap:4px}
.nxt{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:8px;background:var(--cell);border-radius:6px;padding:3px 10px;min-height:30px}
.nxt b{font-size:.93rem;white-space:nowrap}.nxt small{color:var(--muted);font-weight:700;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US");
const pretty = s => esc(s).replace(/'/g, "’");
const stamp = t => { const d = new Date(t); return isNaN(d) ? "unknown" : d.toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); };
/* when each site's prices are from, each site in its own color */
function pricesAsOf(){
  const cz = state.cozy || {};
  return `Prices from <span class="src-msc">MSC</span> ${esc(stamp(state.prices))}${cz.items ? ` and <span class="src-cozy">Cozy</span> ${esc(stamp(cz.updated))}` : ""}`;
}
const STAT = {incPAD:"ATT",incMAD:"M.ATT",incSTR:"STR",incDEX:"DEX",incINT:"INT",incLUK:"LUK",incACC:"ACC",incEVA:"Avoid",
  incPDD:"W.DEF",incMDD:"M.DEF",incMHP:"HP",incMMP:"MP",incSpeed:"Speed",incJump:"Jump",incCRT:"Crit %",incCRD:"Crit dmg",tuc:"Slots"};
let tab = "live", state = null, timer = null, planSave = null, navKey = "", pendingTo = null, profRev = null;

/* ---- the redesign's shared pieces ---- */
const OSMS_IMG = "https://raw.githubusercontent.com/ohmi69/osms_datamine_dashboard/main/data/current/images/";
// each tab's icon: an item from the game
const GI = {live:4000094, nav:2030000, train:1452002, quests:4031001, gear:1002032, skills:4031032, flips:2028001, settings:4000089};
const itemIcon = (id, size = 20) => `<img class="gi" src="${OSMS_IMG}items/${String(id).padStart(8, "0")}.png" width="${size}" height="${size}" alt="">`;
const markIcon = (url, size = 22) => url ? `<img class="gi" src="${esc(url)}" width="${size}" height="${size}" alt="">` : "";
// a window in the game's style; tabs: [[key, label html, selected]]
function gameWin(title, tabs, body, cls = ""){
  const t = tabs && tabs.length ? `<div class="gtabs" role="tablist">${tabs.map(([k, label, on]) =>
    `<button role="tab" data-gtab="${esc(k)}" aria-selected="${!!on}">${label}</button>`).join("")}</div>` : "";
  return `<div class="gwin ${cls}"><div class="gtitle"><span>${esc(title)}</span><span class="gx" aria-hidden="true"></span></div>${t}${body}</div>`;
}
// the game's tooltip, beside what's hovered and kept on screen
function showTip(html, el){
  let tip = $("#tip");
  if (!tip){ tip = document.createElement("div"); tip.id = "tip"; tip.setAttribute("role", "tooltip"); document.body.append(tip); }
  tip.innerHTML = html; tip.style.display = "block";
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
  let x = r.right + 10;
  if (x + w > innerWidth - 8) x = Math.max(8, r.left - w - 10);
  tip.style.left = x + "px";
  tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, r.top - 6)) + "px";
}
function hideTip(){ const tip = $("#tip"); if (tip) tip.style.display = "none"; }
// as many rows as fit the box, the rest on pages with arrows; cols > 1 for a grid of slots
function pageFit(listEl, items, renderRow, pagerEl, cols = 1){
  if (!listEl) return;
  const draw = () => {
    let page = +(listEl.dataset.page || 0);
    listEl.innerHTML = items.length ? renderRow(items[0], 0) : "";
    const first = listEl.firstElementChild, gap = parseFloat(getComputedStyle(listEl).rowGap) || 0;
    const rh = first ? first.getBoundingClientRect().height + gap : 40;
    const fitRows = Math.max(1, Math.floor((listEl.clientHeight + gap) / Math.max(rh, 1)));
    const per = fitRows * cols, pages = Math.max(1, Math.ceil(items.length / per));
    page = Math.max(0, Math.min(page, pages - 1)); listEl.dataset.page = page;
    listEl.innerHTML = items.slice(page * per, page * per + per).map((x, i) => renderRow(x, page * per + i)).join("");
    if (pagerEl){
      pagerEl.innerHTML = pages > 1 ? `<button class="pg" data-pg="-1" aria-label="Previous page" ${page ? "" : "disabled"}>&#9664;</button>
        <span><b>${page + 1}</b> / ${pages}</span><button class="pg" data-pg="1" aria-label="Next page" ${page < pages - 1 ? "" : "disabled"}>&#9654;</button>` : "";
      pagerEl.querySelectorAll("[data-pg]").forEach(b => b.addEventListener("click", () => { listEl.dataset.page = page + +b.dataset.pg; draw(); }));
    }
    listEl.dispatchEvent(new Event("paged"));
  };
  listEl._draw = draw;
  draw();
  if (!listEl._ro){ let h = listEl.clientHeight; listEl._ro = new ResizeObserver(() => { if (listEl.clientHeight !== h){ h = listEl.clientHeight; listEl._draw(); } }); listEl._ro.observe(listEl); }
}

async function api(path, body){
  const r = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json();
}

async function loadState(){
  state = await api("/api/state");
  $("#prices").textContent = "updated " + stamp(state.prices);
  const cz = state.cozy || {};
  $("#cozy-prices").innerHTML = cz.items
    ? `, and <a class="src-cozy" href="https://cozy.markets/items" target="_blank" rel="noopener">Cozy Market</a>, updated ${esc(stamp(cz.updated))}`
    : cz.stale ? `. Cozy Market’s prices are over two weeks old and left out` : "";
  $("#cmap").textContent = $("#cmap").title = state.current ? state.current.name.replace(/'/g, "’") : "not set";
  $("#cname").textContent = state.profile.name || "Job";
  drawGate();
  return state;
}

// The reader is only trusted on a game area at least min_height tall: smaller, its text reads wrong
// and misread titles would land in Quests. Then reading pauses and this covers the dashboard.
function drawGate(){
  const g = state.game || {}, gs = state.game_size, min = state.min_height || 1000;
  const size = g.too_small || (gs && gs[1] >= 200 && gs[1] < min ? gs : null);
  const gate = $("#gate");
  if (!(state.screen && state.screen.reading && size)){ gate.hidden = true; return; }
  const key = size.join("x");
  if (!gate.hidden && gate.dataset.key === key) return;
  gate.dataset.key = key;
  gate.innerHTML = `<div class="box" role="alertdialog" aria-modal="true" aria-labelledby="gate-t" dir="rtl" lang="he">
    <h2 id="gate-t">חלון המשחק קטן מדי לקריאה</h2>
    <div class="size" dir="ltr"><b>${size[0]}×${size[1]}</b> → <span>1920×1080+</span></div>
    <p style="margin:0 0 6px">${he("Companion")} קורא את המשחק רק כשאזור המשחק בגובה ${he(min)} פיקסלים ומעלה. בגודל קטן יותר הטקסט של ה-${he("Quest Helper")} ורשימת הקווסטים נקרא לא נכון, וקווסטים שלא קיימים נכנסים ל-${he("In progress")} ול-${he("Done")}.</p>
    <ol><li>בהגדרות המשחק בחרו רזולוציה ${he("1920×1080")} או גדולה יותר. הקורא כויל על ${he("1920×1200")}.</li>
      <li>שחקו בחלון (${he("Windowed")}) או בחלון בלי מסגרת (${he("Borderless")}), לא במסך מלא.</li>
      <li>החלון הזה נעלם לבד כשהגודל מתאים. עד אז הקריאה עוצרת, אז שום דבר לא משתבש.</li></ol>

  if (i.verdict === "npc") return `An NPC pays ${money(i.npc)}`;
  if (i.verdict === "split") return "The two sites disagree, so no verdict: compare their prices and decide";
  if (i.verdict === "info") return "Only Cozy Market has a price for it, so no verdict";
  if (i.verdict === "snipe") return `In the cheapest quarter of recent sales${both}`;
