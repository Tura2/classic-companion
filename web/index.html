// Map pictures come in every shape, so each sits in a box of one size: zoomed in on the portal or
// NPC to look for, or the whole map when there's nothing to circle. Drag to look around, wheel or
// +/- to zoom. The picture comes from Companion's own copy (fetched once, shrunk), else from OSMS.
const FOCUS_SPAN = 1100;          // map pixels across the box's shorter side when zoomed on a target
const mapViews = new Map();       // kept between redraws, so a poll doesn't reload the picture or undo your zoom
const mapExtras = new Map();      // what to draw on a map: the game's portals with where they lead, NPCs standing
let portalMeta = null;            // the portal picture's anchor and size, or false when there's none
function mapBox(id, remote, name, target, extras){
  if (!id) return "";
  const key = `${id}:${target ? target.x + "," + target.y : ""}:${extras ? extras.key || "x" : ""}`;
  if (extras) mapExtras.set(key, extras);
  return `<div class="mapview" data-mapview="${esc(key)}" data-id="${id}" data-remote="${esc(remote || "")}" data-name="${esc(name || "")}"${target ? ` data-x="${target.x}" data-y="${target.y}" data-lift="${target.lift || 0}"` : ""}></div>`;
}
// a name tag on the map, in map pixels
function mapLabel(x, y, text, fs, cls){
  const w = Math.round(text.length * fs * 0.56 + fs), h = Math.round(fs * 1.7);
  return `<g class="plabel ${cls}" transform="translate(${x} ${y})"><rect x="${-w / 2}" y="0" width="${w}" height="${h}" rx="${fs * 0.45}"/>
    <text y="${fs * 1.2}" text-anchor="middle" style="font-size:${fs}px">${esc(text)}</text></g>`;
}
function drawExtras(ex, W, H){
  if (!ex) return "";
  const fs = Math.max(20, Math.round(Math.min(W, H) * 0.014)), pm = portalMeta;
  let out = "";
  for (const p of ex.portals || []){
    if (pm) out += `<image href="/api/portal.webp" x="${p.x - pm.anchor[0]}" y="${p.y - pm.anchor[1]}" width="${pm.size[0]}" height="${pm.size[1]}"/>`;
    out += mapLabel(p.x, p.y + fs * 0.4, p.to, fs, p.target ? "t" : "");
  }
  for (const n of ex.npcs || []){
    out += `<image href="${esc(n.img)}" x="${n.x - 70}" y="${n.y - 150}" width="140" height="150" preserveAspectRatio="xMidYMax meet"/>`;
    if (n.on) out += mapLabel(n.x, n.y + fs * 0.3, n.name, fs, "t");
  }
  return out;
}
function wireMaps(){
  document.querySelectorAll("#view [data-mapview]").forEach(ph => {
    const key = ph.dataset.mapview, kept = mapViews.get(key);
    if (kept && kept !== ph){ ph.replaceWith(kept); kept._refit(); return; }
    mapViews.set(key, ph);
    if (mapViews.size > 12) mapViews.delete(mapViews.keys().next().value);
    buildMap(ph);
  });
}
function preloadMap(id){ if (id) new Image().src = "/api/mapimg?id=" + id; }
function buildMap(el){
  const d = el.dataset, target = d.x != null ? {x:+d.x, y:+d.y, lift:+(d.lift || 0)} : null;
  el.innerHTML = `<div class="stage"><img alt="Map of ${esc(d.name)}" draggable="false"><svg preserveAspectRatio="none"></svg></div>
    <div class="maploading">Loading the map…</div>
    <div class="mapctl"><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" data-z="out" aria-label="Zoom out">−</button>
      ${target ? `<button type="button" data-z="focus">Circled spot</button>` : ""}<button type="button" data-z="fit">Whole map</button></div>`;
  const img = el.querySelector("img"), svg = el.querySelector("svg"), stage = el.querySelector(".stage");
  let scale = 1, z = 1, tx = 0, ty = 0, ready = false, moved = false, ring = null, base = 60;
  const size = () => [el.clientWidth, el.clientHeight];
  const fitZ = () => { const [w, h] = size(); return Math.min(w / img.naturalWidth, h / img.naturalHeight); };
  function apply(){
    const [w, h] = size(), iw = img.naturalWidth * z, ih = img.naturalHeight * z;
    tx = iw <= w ? (w - iw) / 2 : Math.min(0, Math.max(w - iw, tx));   // never past the map's edge
    ty = ih <= h ? (h - ih) / 2 : Math.min(0, Math.max(h - ih, ty));
    stage.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
    if (ring) ring.forEach(c => c.setAttribute("r", Math.max(base, 20 / (z * scale))));   // still easy to spot with the whole map showing
  }
  function view(mode){
    if (!ready || !el.clientWidth) return;
    const [w, h] = size();
    if (mode === "fit" || !target) z = fitZ();
    else {
      z = Math.min(3, Math.max(fitZ(), Math.min(w, h) / (FOCUS_SPAN * scale)));
      tx = w / 2 - target.x * scale * z; ty = h / 2 - (target.y - target.lift) * scale * z;
    }
    apply();
  }
  function zoomAt(f, cx, cy){
    const nz = Math.min(4, Math.max(fitZ(), z * f));
    tx = cx - (cx - tx) * nz / z; ty = cy - (cy - ty) * nz / z; z = nz; moved = true; apply();
  }
  el._refit = () => moved ? apply() : view("focus");
  function show(s){
    scale = s || 1; ready = true;
    const W = img.naturalWidth / scale, H = img.naturalHeight / scale;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("width", img.naturalWidth); svg.setAttribute("height", img.naturalHeight);
    svg.innerHTML = drawExtras(mapExtras.get(d.mapview), W, H);
    if (target){
      base = Math.max(target.lift ? 130 : 50, Math.min(W, H) * 0.06);
      const cy = target.y - target.lift;
      svg.insertAdjacentHTML("beforeend", `<circle class="ring halo" vector-effect="non-scaling-stroke" cx="${target.x}" cy="${cy}" r="${base}"/>
        <circle class="ring" vector-effect="non-scaling-stroke" cx="${target.x}" cy="${cy}" r="${base}"/>`);
      ring = [...svg.querySelectorAll("circle")];
    }
    el.classList.add("ready");
    view("focus");
  }
  img.addEventListener("load", async () => {
    if (img.dataset.remote) return show(1);
    try{ show((await api("/api/mapsize?id=" + d.id)).scale); }catch(e){ show(1); }
  });
  img.addEventListener("error", () => {
    if (d.remote && !img.dataset.remote){ img.dataset.remote = "1"; img.src = d.remote; }
    else el.querySelector(".maploading").textContent = "No picture of this map.";
  });
  img.src = "/api/mapimg?id=" + d.id;
  el.querySelectorAll("[data-z]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const [w, h] = size(), k = b.dataset.z;
    if (k === "in" || k === "out") zoomAt(k === "in" ? 1.4 : 1 / 1.4, w / 2, h / 2);
    else { moved = k === "fit"; view(k); }
  }));
  el.addEventListener("wheel", e => {
    if (!ready) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});
  let drag = null;
  el.addEventListener("pointerdown", e => {
    if (!ready || e.target.closest(".mapctl")) return;
    drag = {x: e.clientX, y: e.clientY, tx, ty}; el.setPointerCapture(e.pointerId); el.classList.add("drag");
  });
  el.addEventListener("pointermove", e => {
    if (!drag) return;
    tx = drag.tx + e.clientX - drag.x; ty = drag.ty + e.clientY - drag.y; moved = true; apply();
  });
  const end = () => { drag = null; el.classList.remove("drag"); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("dblclick", () => { moved = false; view("focus"); });
  new ResizeObserver(() => el._refit()).observe(el);
}

function guideBox(gd){
  // each step: ✓ done, ▶ now, then what comes after. The step to do now says where and how, and can
  // be ticked by hand (talked to someone, or no screen reading to see the counts)
  const steps = (gd.steps || []).map((st, i) => {
    const now = i === gd.step, cnt = st.need ? `${st.have != null ? st.have : "?"} / ${st.need}` : "";
    return `<li class="${st.done ? "done" : now ? "now" : ""}"${now ? ' aria-current="step"' : ""}>
      <span class="mark" aria-hidden="true">${st.done ? "✓" : now ? "▶" : i + 1}</span>
      <span>${pretty(st.text)}</span><span class="cnt${st.have != null && st.have >= st.need ? " okc" : ""}">${cnt}</span>
      ${(now || !st.done) && st.how ? `<span class="ghow">${pretty(st.how.charAt(0).toUpperCase() + st.how.slice(1))}</span>` : ""}
      ${st.kind !== "back" && (now || (gd.checked || []).includes(st.key)) ? `<button class="btn small tick" data-check="${esc(st.key)}" data-on="${st.done ? "" : "1"}">${st.done ? "Not done yet" : "Done this step"}</button>` : ""}
    </li>`;
  }).join("");
  return win("Quest guide", `<div class="body">
      <div class="sub">${pretty(gd.name)}</div>
      <h3 style="color:${gd.done ? "var(--good)" : "var(--warn)"};margin:2px 0 4px">${pretty(gd.text || gd.goal)}</h3>
      ${gd.task ? `<p class="sub" style="margin:0">${pretty(gd.task)}</p>` : ""}
      <ol class="gsteps">${steps}</ol>
      ${gd.tracked ? "" : `<p class="sub" style="margin:8px 0 0">Track this quest in the game’s Quest Helper so Companion can follow your counts, or tick each step as you go.</p>`}
      <div class="btns" style="margin:10px 0 0"><button class="btn" id="stopguide">Stop the guide</button></div></div>`,
    gd.where ? `to ${pretty(gd.where.name)}` : "");
}

/* ---- Go to: where you are (its monsters, or who's in town), quick picks, and the map with the game's portals ---- */
const TOWNS = [["Henesys", "Henesys"], ["Ellinia", "Ellinia"], ["Perion", "Perion"], ["Kerning City", "KerningCity"], ["Sleepywood", "Dungeon"], ["Lith Harbor", "Rith"]];
let townIds = null, navNpc = null, navWrong = false;
const hereById = new Map();
async function hereOf(id){
  if (!hereById.has(id)) hereById.set(id, await api("/api/here?id=" + id).catch(() => null));
  return hereById.get(id);
}
async function loadTowns(){
  if (townIds) return townIds;
  const found = await Promise.all(TOWNS.map(([n]) => api("/api/maps?q=" + encodeURIComponent(n)).catch(() => [])));
  townIds = TOWNS.map(([n, mark], k) => ({name: n, mark, id: ((found[k] || []).find(m => m.name === n) || {}).id})).filter(x => x.id);
  return townIds;
}
const markUrl = mark => `${OSMS_IMG}map_marks/${mark}.png`;
// where on the map someone stands, in words: "on the upper left, by the Henesys Park door"
function whereOnMap(x, y, size, portals){
  if (!size || !size.w) return "";
  const col = x < size.w / 3 ? "left" : x > size.w * 2 / 3 ? "right" : "middle", row = y < size.h * 0.45 ? "upper " : "";
  const near = (portals || []).map(p => [Math.hypot(p.x - x, p.y - y), p]).sort((a, b) => a[0] - b[0])[0];
  return `stands on the ${row}${col}${near && near[0] < 600 ? `, by the ${near[1].to} door` : ""}`;
}
function hereLeft(h){
  if (!h) return win(`${itemIcon(GI.nav, 22)} Where you are`, `<div class="body">${searchBox("here", "Set the map you’re on")}</div>`);
  const fix = navWrong ? searchBox("here", "Set the map you’re on") : "";
  const people = h.town ? `<div class="qh" style="margin-top:0">People here · tap one to see where they stand</div>
      <div class="npcs">${h.npcs.map(n => `<button class="npc${navNpc === n.id ? " on" : ""}" data-npc="${n.id}"><img src="${esc(n.img)}" alt="" loading="lazy">
        <b>${pretty(n.name)}</b>${n.role ? `<span class="role r-${n.role.toLowerCase()}">${n.role}</span>` : "<span></span>"}</button>`).join("")}</div>`
    : h.mobs.length ? `<div class="mobs2">${h.mobs.map(m => `<div class="mobc">${m.img ? `<img src="${esc(m.img)}" alt="" loading="lazy">` : ""}
        <div><b>${pretty(m.name)}</b><span>Lv ${m.level}${m.count ? ` · ×${m.count}` : ""}</span></div></div>`).join("")}</div>`
    : `<p class="sub" style="margin:0">No monsters here.</p>`;
  return `<section class="card win${h.town ? " grow" : ""}"><div class="title"><span>${markIcon(h.mark, 22)} You’re here · ${pretty(h.name)}</span>
      <small>${h.town ? "Town · " : ""}<a href="#" id="wrongmap">Wrong map?</a></small></div><div class="body${h.town ? " scrolly" : ""}">${fix}${people}</div></section>`;
}
function whereTo(towns, train, mine, recent, short){
  const quick = `<div class="qgrid">${towns.map(x => `<button class="qb" data-goid="${x.id}" data-name="${esc(x.name)}">${markIcon(markUrl(x.mark), 22)} ${esc(x.name)}</button>`).join("")}</div>`;
  const more = short ? "" : `${train.length ? `<div class="qh">Train for your level</div><div class="qlist">${train.map(m => `<button class="qr" data-goid="${m.id}" data-name="${esc(m.name)}">
        ${itemIcon(GI.train, 18)}<b>${pretty(m.name)}</b><span>${mine[m.id] ? `${perHr(mine[m.id])} EXP/hr` : `${fmt(m.count)} monsters`}</span></button>`).join("")}</div>` : ""}
      ${recent.length ? `<div class="qh">Recent</div><div class="qchips">${recent.map(m => `<button class="qc" data-goid="${m.id}" data-name="${esc(m.name)}">${pretty(m.name)}</button>`).join("")}</div>` : ""}`;
  return `<section class="card win${short ? "" : " grow"}"><div class="title"><span>${itemIcon(GI.nav, 22)} Where to</span></div>
    <div class="body${short ? "" : " scrolly"}">${pendingTo ? `<p style="margin:0 0 8px">Going to <b>${pretty(pendingTo.name)}</b>. Set where you are first.</p>` : ""}
      ${searchBox("dest", "Search")}${quick}${more}</div></section>`;
}
async function renderNav(force){
  await loadState();
  if (tab !== "nav") return;
  const nav = state.nav, gd = state.guide, cur = state.current && state.current.id;
  const key = JSON.stringify([nav && nav.i, nav && nav.steps.length, nav && nav.to.id, cur, gd, navNpc, navWrong]);
  if (!force && key === navKey) return;
  navKey = key;
  if (portalMeta === null) portalMeta = await api("/api/portal").then(j => j && j.anchor ? j : false).catch(() => false);
  const h = cur ? await hereOf(cur) : null;
  const [towns, train, gr] = await Promise.all([loadTowns(), api("/api/train").catch(() => []), api("/api/grind").catch(() => null)]);
  if (tab !== "nav") return;
  const mine = (gr && gr.by_map) || {};
  let left = hereLeft(h) + (gd ? guideBox(gd) : whereTo(towns, train.slice(0, 3), mine, state.recent || [], !!(h && h.town)));
  let right;
  if (nav){
    const st = nav.steps[nav.i], last = nav.steps.length - 1, sh = await hereOf(st.id);
    const extras = {key: "route" + nav.i, portals: ((sh && sh.portals) || []).map(p => ({...p, target: st.portal && p.x === st.portal.x && p.y === st.portal.y}))};
    const head = st.arrived
      ? `<div class="rhead"><div class="arrow ok">✓</div><div><h3>You’re there: ${pretty(st.name)}</h3>${st.npc ? `<div class="sub">Find ${pretty(st.npc.name)}, circled on the map.</div>` : ""}</div></div>`
      : `<div class="rhead"><div class="arrow">${esc(st.hint.arrow)}</div><div><h3>Portal on the ${esc(st.hint.text)}</h3><div class="sub">in ${pretty(st.name)}, leads to ${pretty(st.to.name)}</div></div></div>`;
    const target = st.portal ? {...st.portal, lift: portalMeta ? 110 : 0} : st.npc ? {...st.npc, lift: 75} : null;
    right = `<section class="card win route"><div class="title"><span>${st.arrived ? "Arrived" : `Step ${nav.i + 1} of ${last}`}</span><small>to ${pretty(nav.to.name)}</small></div>
      <div class="body">${head}${mapBox(st.id, st.render, st.name, target, extras)}
        <div class="rbtns">${st.arrived ? "" : `<button class="btn primary" data-step="${nav.i + 1}">I went through</button>`}
          <button class="btn" id="stop">Stop route</button>
          ${state.screen.drawing ? `<button class="btn" data-cmd="nav_corner">Move the card on the game</button>` : ""}
          <div class="steps2">${nav.steps.map((s, i) => `<button class="st${i === nav.i ? " cur" : i < nav.i ? " done" : ""}" data-step="${i}">${i + 1}. ${pretty(s.name)}</button>`).join("")}</div></div>
      </div></section>`;
  } else if (h){
    const pick = h.npcs.find(n => n.id === navNpc);
    const size = pick ? await api("/api/mapsize?id=" + h.id).catch(() => null) : null;
    const extras = {key: "here" + (navNpc || ""), portals: h.portals, npcs: h.town ? h.npcs.map(n => ({...n, on: n.id === navNpc})) : []};
    const head = pick ? `<div class="rhead"><img class="npcbig" src="${esc(pick.img)}" alt=""><div><h3>${pretty(pick.name)}</h3>
        <div class="sub">${pick.role === "Quests" ? "Gives quests · " : pick.role === "Taxi" ? "Taxi · " : ""}${esc(whereOnMap(pick.x, pick.y, size, h.portals))}</div></div></div>`
      : `<p class="sub" style="margin:0">${h.town ? "Tap someone on the left to see where they stand. " : ""}Every portal shows where it leads.</p>`;
    right = `<section class="card win route"><div class="title"><span>${markIcon(h.mark, 22)} ${pretty(h.name)}</span>
      <small>${h.town ? `${h.npcs.length} people · ` : ""}${h.portals.length} portals</small></div>
      <div class="body">${head}${mapBox(h.id, null, h.name, pick ? {x: pick.x, y: pick.y, lift: 75} : null, extras)}</div></section>`;
  } else right = `<div class="empty">Set the map you’re on, on the left, and its map shows here.</div>`;
  $("#view").innerHTML = `<div class="go"><div class="colL">${left}</div>${right}</div>`;
  const wm = $("#wrongmap"); if (wm) wm.addEventListener("click", e => { e.preventDefault(); navWrong = !navWrong; renderNav(true); });
  if ($("#here")) wireSearch("here", async id => { navWrong = false; navNpc = null; await api("/api/here", {id}); if (pendingTo){ const t = pendingTo; pendingTo = null; await goTo(t.id, t.name, t.npc); } else renderNav(true); });
  if ($("#dest")) wireSearch("dest", async (id, name) => { pendingTo = null; const r = await api("/api/nav", {to:id, from: cur}); if (r.error) alert(r.error); renderNav(true); });
  document.querySelectorAll("[data-goid]").forEach(b => b.addEventListener("click", () => goTo(+b.dataset.goid, b.dataset.name)));
  document.querySelectorAll("[data-npc]").forEach(b => b.addEventListener("click", () => { navNpc = navNpc === +b.dataset.npc ? null : +b.dataset.npc; renderNav(true); }));
  const sg = $("#stopguide"); if (sg) sg.addEventListener("click", async () => { await api("/api/guide", {stop:true}); renderNav(true); });
  document.querySelectorAll("#view [data-check]").forEach(b => b.addEventListener("click", async () => {
    await api("/api/guide", {id: state.guide.id, check: b.dataset.check, on: !!b.dataset.on}); renderNav(true); }));
  document.querySelectorAll("#view [data-step]").forEach(b => b.addEventListener("click", async () => { await api("/api/nav/step", {i:+b.dataset.step}); renderNav(true); }));
  const stop = $("#stop"); if (stop) stop.addEventListener("click", async () => { await api("/api/nav/stop", {}); renderNav(true); });
  document.querySelectorAll("#view [data-cmd]").forEach(b => b.addEventListener("click", () => api("/api/" + b.dataset.cmd, {})));
  wireMaps();
  if (nav){ const next = nav.steps[nav.i + 1]; if (next) preloadMap(next.id); }
}

// Quests: In progress / Can take / Locked (needs an earlier quest) / Done, the chosen quest in full
let qTab = null, qPick = null;
const QTABS = {active: "In progress", ready: "Can take", locked: "Locked", done: "Done"};
const QHELP = {locked: "Need an earlier quest finished first"};
function questDetail(q, h, kind){
  const have = h ? Object.fromEntries(h.needs.map(n => [n.what, n.have])) : {};
  const todo = q.todo.map(t => {
    const got = have[t.name], full = got != null && got >= t.count;
    const drops = (t.drops || []).map(x => `${pretty(x.monster)} (${x.rate < 10 ? x.rate.toFixed(1) : Math.round(x.rate)}%)`).join(", ");
    const hint = t.kind === "mob" ? (t.where ? `Most at ${pretty(t.where.name)}` : "")
      : [drops ? `Drops from ${drops}${t.where ? `, most at ${pretty(t.where.name)}` : ""}` : "", t.buy ? `or buy all ${t.count} for about ${fmt(t.buy_total)}` : ""].filter(Boolean).join("; ");
    return `<div class="mob">${t.img ? `<img src="${esc(t.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
      <div class="grow"><b>${t.kind === "mob" ? "Defeat" : "Collect"} ${pretty(t.name)}</b>
        <span class="sub" style="display:block">${hint.charAt(0).toUpperCase() + hint.slice(1)}</span></div>
      <b class="${full ? "okc" : ""}">${got != null ? `${got} / ${t.count}` : `×${t.count}`}</b>
      ${t.where ? `<button class="btn small" data-hunt="${t.where.map}" data-name="${esc(t.where.name)}">Go</button>` : ""}</div>`;
  }).join("");
  const steps = (q.steps || []).map((st, i) => `<li>${st.kind === "monster" ? `Defeat ${pretty(st.name)}`
      : st.kind === "npc" ? `${i === 0 ? "Talk to" : i === q.steps.length - 1 ? "Bring it to" : "See"} <b>${pretty(st.name)}</b>${st.map ? ` in ${pretty(st.map)}` : ""}`
      : `Go to ${pretty(st.map)}`}</li>`).join("");
  const back = q.turn_in && q.turn_in.npc !== q.npc ? q.turn_in : null;
  const rewards = [q.exp ? `<li class="good">${fmt(q.exp)} EXP</li>` : "", q.money ? `<li>${fmt(q.money)} mesos</li>` : ""]
    .concat(q.items.map(i => `<li title="${esc(i.name)}${i.value ? `, worth about ${fmt(i.value)}` : ""}">${pretty(i.name)}${i.count > 1 ? " ×" + i.count : ""}${i.chance ? `, ${i.chance}%` : ""}${i.only ? `, ${esc(i.only)} only` : ""}${i.value ? `, ~${fmt(i.value)}` : ""}</li>`)).join("");
  const tags = [q.job_quest ? `<li class="warn">Job quest</li>` : "", q.daily ? `<li>Daily</li>` : "", q.weekly ? `<li>Weekly</li>` : "",
    `<li>Level ${q.level}+</li>`, `<li>${esc(q.region)}</li>`].join("");
  const guiding = state.guide && state.guide.id === q.id;
  const actions = kind === "done"
    ? `<button class="btn" data-undone="${esc(q.id)}">Not done</button>`
    : kind === "active" ? `<button class="btn primary" data-guide="${esc(q.id)}">${guiding ? "Guiding it now" : "Guide me in game"}</button>
       <button class="btn" data-done="${esc(q.id)}">Done</button>
       <button class="btn" data-inactive="${esc(q.id)}" title="Not in your quest log: the game was misread, or you dropped it">Not in progress</button>`
    : `${q.todo.length || q.where ? `<button class="btn primary" data-guide="${esc(q.id)}">${guiding ? "Guiding it now" : "Guide me in game"}</button>` : ""}
       ${q.where ? `<button class="btn" data-npc="${q.npc_id}" data-npcname="${esc(q.npc)}" data-map="${q.where.id}" data-mapname="${esc(q.where.name)}">Take me to ${pretty(q.npc)}</button>` : ""}
       ${back && back.where ? `<button class="btn" data-hunt="${back.where.id}" data-name="${esc(back.where.name)}">Take me to ${pretty(back.npc)}</button>` : ""}
       <button class="btn" data-done="${esc(q.id)}">Done</button>`;
  return win(pretty(q.name), `<div class="body">
      <div class="row">${slot(q.npc_img, 48)}<div class="grow"><div class="sub">From</div><b>${pretty(q.npc)}</b>${q.where ? `<div class="sub">${pretty(q.where.name)}</div>` : ""}</div></div>
      <ul class="chips">${tags}</ul>
      ${q.task ? `<div class="task"><b>What to do</b>${pretty(q.task)}</div>` : ""}
      ${kind === "locked" ? `<p class="risk" style="margin:10px 0 0">Do first: ${q.needs.map(pretty).join(", ")}</p>` : ""}
      ${steps ? `<h2 style="margin:14px 0 4px">Steps</h2><ol class="qsteps">${steps}</ol>` : ""}
      ${back ? `<p class="risk" style="margin:8px 0 0">Bring it back to <b>${pretty(back.npc)}</b>${back.where ? ` in ${pretty(back.where.name)}` : ""}, not to ${pretty(q.npc)}.</p>` : ""}
      ${todo ? `<h2 style="margin:14px 0 4px">What you need</h2><div class="mobs" style="margin:0">${todo}</div>` : ""}
      ${rewards ? `<h2 style="margin:14px 0 4px">Rewards</h2><ul class="chips" style="margin:0">${rewards}</ul>` : ""}
      ${q.next ? `<p class="sub" style="margin:8px 0 0">Leads to: ${pretty(q.next)}</p>` : ""}
      ${q.intro ? `<p class="sub" style="margin:10px 0 0">${pretty(q.intro)}</p>` : ""}
      ${q.wiki ? `<p class="sub" style="margin:10px 0 0;font-size:.78rem">Steps and drops: <a href="https://classicmaple.wiki" target="_blank" rel="noopener">Classic Maple Wiki</a> contributors, from <a href="${esc(q.wiki)}" target="_blank" rel="noopener">MapleClassic Wiki</a>, CC BY-NC-SA 4.0, reformatted.</p>` : ""}
      <div class="btns" style="margin:14px 0 0">${actions}</div></div>`, kind === "active" ? "in progress" : "");
}
async function renderQuests(){
  const d = await api("/api/quests"), p = state.profile;
  const prog = Object.fromEntries(((state.game || {}).helper || []).filter(h => h.id).map(h => [h.id, h]));
  const lists = {active: d.active, ready: d.ready, locked: d.locked, done: d.done};
  if (!qTab) qTab = d.active.length ? "active" : "ready";
  const list = lists[qTab];
  const q = list.find(x => x.id === qPick) || list[0];
  qPick = q && q.id;
  const unknown = qTab === "active" ? (p.quests_active || []).filter(a => !a.id).map(a => a.name) : [];
  const empty = {active: "Nothing in progress that Companion knows of. Open the game’s Quest window (Q) on its In Progress tab, or track quests in the Quest Helper.",
    ready: "Nothing open at this level. Check back after leveling.", locked: "Nothing waiting on an earlier step.",
    done: "Nothing marked done yet. Open the game’s Quest window (Q) on its Completed tab and Companion marks them for you, or tap Done on a quest."}[qTab];
  const rows = list.map(x => `<button class="vtab" role="tab" aria-selected="${q && x.id === q.id}" data-id="${esc(x.id)}">
      ${slot(x.npc_img, 36)}<span class="grow"><b>${pretty(x.name)}</b><small>${prog[x.id] ? "Counting in the Quest Helper" : `Level ${x.level}+, ${esc(x.region)}${x.job_quest ? ", job quest" : ""}`}</small></span>
      <span class="score">${x.exp ? `${fmt(x.exp)}<small>EXP</small>` : ""}</span></button>`).join("");
  const island = p.level < 16 || state.on_island ? `<label class="toggle" style="margin:0 2px 10px"><input type="checkbox" id="island" ${state.on_island ? "checked" : ""}>
      I’m still on Maple Island <span class="sub">(the boat to Victoria Island is one-way)</span></label>` : "";
  $("#view").innerHTML = `${island}<div class="filters" role="tablist" aria-label="Quests">${Object.entries(QTABS).map(([k, t]) =>
      `<button role="tab" data-q="${k}" aria-pressed="${k === qTab}"${QHELP[k] ? ` title="${QHELP[k]}"` : ""}>${t} ${lists[k].length}</button>`).join("")}</div>
    <div class="md" style="margin-top:8px"><div class="master" role="tablist">${rows || `<p class="sub" style="padding:10px;margin:0">${empty}</p>`}
      ${unknown.length ? `<p class="sub" style="padding:8px;margin:0">Also in your quest log: ${unknown.map(pretty).join(", ")}</p>` : ""}</div>
      <div class="detail">${q ? questDetail(q, prog[q.id], qTab) : ""}</div></div>`;
  document.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { qTab = b.dataset.q; qPick = null; renderQuests(); }));
  document.querySelectorAll(".vtab[data-id]").forEach(b => b.addEventListener("click", () => { qPick = b.dataset.id; renderQuests(); }));
  const isl = $("#island");
  if (isl) isl.addEventListener("change", async () => { await api("/api/profile", {island:isl.checked}); await loadState(); renderQuests(); });
  document.querySelectorAll("[data-done]").forEach(b => b.addEventListener("click", async () => { await api("/api/quest_done", {id:b.dataset.done, done:true}); qPick = null; renderQuests(); }));
  document.querySelectorAll("[data-inactive]").forEach(b => b.addEventListener("click", async () => { await api("/api/quest_active", {id:b.dataset.inactive}); qPick = null; renderQuests(); }));
  document.querySelectorAll("[data-undone]").forEach(b => b.addEventListener("click", async () => { await api("/api/quest_done", {id:b.dataset.undone, done:false}); qPick = null; renderQuests(); }));
  document.querySelectorAll("[data-guide]").forEach(b => b.addEventListener("click", async () => {
    const r = await api("/api/guide", {id:b.dataset.guide});
    if (r.error){ alert(r.error); return; }
    switchTab("nav");
  }));
  document.querySelectorAll("[data-npc]").forEach(b => b.addEventListener("click", () =>
    goTo(+b.dataset.map, b.dataset.mapname, {id:+b.dataset.npc, name:b.dataset.npcname})));
  document.querySelectorAll("[data-hunt]").forEach(b => b.addEventListener("click", () => goTo(+b.dataset.hunt, b.dataset.name)));
  fitPanes();
}

// Gear: Classic's Equipment Inventory with the best item in each slot, the game's tooltip on hover
const EQ_SLOTS = {Hat:[100, 95], "Ear Acc":[146, 142], Cape:[7, 188], Top:[54, 188], Weapon:[146, 188], Shield:[193, 188],
                  Gloves:[7, 234], Bottom:[54, 234], Shoes:[54, 281]};
const EQ_FROM = {Hat:"Hat", Earring:"Ear Acc", Cape:"Cape", Top:"Top", Bottom:"Bottom", Glove:"Gloves", Shoes:"Shoes", Weapon:"Weapon", Shield:"Shield"};
const TIP_STAT = {incPAD:"Weapon Attack", incMAD:"Magic Attack", incSTR:"STR", incDEX:"DEX", incINT:"INT", incLUK:"LUK",
  incACC:"Accuracy", incEVA:"Avoidability", incPDD:"Weapon Def.", incMDD:"Magic Def.", incMHP:"HP", incMMP:"MP",
  incSpeed:"Speed", incJump:"Jump", incCRT:"Critical Rate", incCRD:"Critical Damage"};
const GAME_JOBS = [["BEGINNER", ""], ["WARRIOR", "Warrior"], ["MAGICIAN", "Mage"], ["BOWMAN", "Bowman"], ["THIEF", "Thief"]];
function gearTip(e){
  const mine = state.profile.stats || (state.game || {}).stat || {};
  const req = k => {
    const v = k === "LEV" ? e.req : (e.reqs[k] || 0), have = k === "LEV" ? state.profile.level : mine[k.toLowerCase()];
    const cls = !v ? "zero" : have != null && have < v ? "bad" : "";
    return `<div class="rq ${cls}"><span>REQ ${k}</span><span>: ${v}</span></div>`;
  };
  const jobs = GAME_JOBS.map(([label, key]) => `<span class="${e.job === "All" || (key && (e.job || "").split("/").includes(key)) ? "on" : ""}">${label}</span>`).join("");
  const rows = [["Type", e.weapon_type || e.slot]];
  if (e.speed) rows.push(["Attack Speed", `${e.speed}${e.speed_n != null ? ` (${e.speed_n})` : ""}`]);
  Object.entries(e.stats).filter(([k, v]) => v && TIP_STAT[k]).forEach(([k, v]) => rows.push([TIP_STAT[k], `${v > 0 ? "+" : ""}${v}${k === "incCRT" ? "%" : ""}`]));
  if (e.stats.tuc != null) rows.push(["Remaining Enhancements", e.stats.tuc]);
  const fm = e.fm;
  const price = fm && (fm.snipe || fm.cozy) ? `<div class="tprice"><div><span>Snipe at</span><b class="msc">${fm.snipe ? fmt(fm.snipe) : "—"}</b></div>
      <div><span>MSC usual</span><b class="msc">${fm.median ? fmt(fm.median) : "—"}</b></div><div><span>Cozy</span><b class="cozy">${fm.cozy ? fmt(fm.cozy) : "—"}</b></div></div>`
    : `<div class="tprice none">Not traded on the market yet</div>`;
  return `<div class="tname"><i></i>${pretty(e.name)}</div>
    <div class="ttop"><div class="timg"><img src="${esc(e.img)}" alt=""></div><div class="treq">${["LEV", "STR", "DEX", "INT", "LUK"].map(req).join("")}</div></div>
    <div class="tjobs">${jobs}</div><hr><ul>${rows.map(([k, v]) => `<li><b>${k}:</b> ${esc(v)}</li>`).join("")}</ul>${price}`;
}
async function renderGear(){
  const g = await api("/api/gear");
  if (tab !== "gear") return;
  if (!g.slots.length){ $("#view").innerHTML = `<div class="empty">No gear found for this job and level.</div>`; return; }
  const picks = [];
  for (const s of g.slots){
    const e = s.now[0] || s.soon[0];
    if (s.slot === "Overall"){ if (g.overall_instead) picks.push(["Top", e]); continue; }
    if (s.slot === "Top" && g.overall_instead) continue;
    if (s.slot === "Bottom" && g.overall_instead) continue;
    if (EQ_FROM[s.slot]) picks.push([EQ_FROM[s.slot], e]);
  }
  const order = Object.keys(EQ_SLOTS);
  picks.sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));
  const p = state.profile, total = picks.reduce((a, [, e]) => a + ((e.fm && e.fm.snipe) || 0), 0);
  const overall = (g.slots.find(s => s.slot === "Overall") || {}).now;
  const slots = picks.map(([w, e], k) => `<button class="eq" data-i="${k}" style="left:${EQ_SLOTS[w][0]}px;top:${EQ_SLOTS[w][1]}px" aria-label="${esc(w)}: ${esc(e.name)}">
      <img src="${esc(e.img)}" alt=""></button>`).join("");
  const rows = picks.map(([w, e], k) => `<button class="grow-row" data-i="${k}">${slot(e.img, 36)}
      <span class="nm"><b>${pretty(e.name)}</b><span>${esc(w)} · Lv ${e.req}${e.soon ? " (soon)" : ""}</span></span>
      <span class="pz">${e.fm && e.fm.snipe ? `<span class="src src-msc"><i>MSC</i>${fmt(e.fm.snipe)}</span>` : `<span class="sub">not traded</span>`}</span></button>`).join("");
  $("#view").innerHTML = `<div class="gearpage">
    <div class="ewbox" id="ewbox"><div class="ewin" id="ewin"><img class="bg" src="/equip_classic.png" alt="Equipment Inventory">${slots}
      <div class="ewfoot">Best ${esc(p.job)} gear for Lv ${p.level}</div></div></div>
    <section class="card win glist"><div class="title"><span>${itemIcon(GI.gear, 22)} Best gear for your level</span><small>hover an item to see it</small></div>
      <div class="body">${rows}
        <div class="sumrow"><span>Whole set at snipe prices</span><b class="src src-msc"><i>MSC</i>${fmt(total)}</b><span class="sub">you have ${fmt(p.mesos || 0)}</span></div>
        <p class="sub" style="margin:6px 0 0">Snipe: a good price to buy at, the cheapest quarter of recent sales.${!g.overall_instead && overall && overall[0]
          ? ` An Overall instead of top and bottom: ${pretty(overall[0].name)}${overall[0].fm && overall[0].fm.snipe ? `, MSC ${fmt(overall[0].fm.snipe)}` : ""}.` : ""}</p>
      </div></section></div>`;
  const box = $("#ewbox"), win_ = $("#ewin");
  const fit = () => { const k = Math.min(1.6, box.clientHeight / 404 || 1); win_.style.transform = `scale(${k})`; box.style.width = 244 * k + "px"; };
  fit(); new ResizeObserver(fit).observe(box);
  document.querySelectorAll("#view [data-i]").forEach(b => {
    b.addEventListener("mouseenter", () => { showTip(gearTip(picks[+b.dataset.i][1]), b); document.querySelectorAll("#view [data-i]").forEach(x => x.classList.toggle("sel", x.dataset.i === b.dataset.i)); });
    b.addEventListener("mouseleave", hideTip);
    b.addEventListener("focus", () => b.dispatchEvent(new Event("mouseenter")));
    b.addEventListener("blur", hideTip);
  });
}

// The class guide's SP table, level by level, with what your skills in the game already reach
function buildTable(t, now, level){
  const short = n => n.replace(/^The /, "");
  const rows = t.rows.map(r => {
    const done = t.yours && r.spend.every(([k]) => (now[k] || 0) >= r.after[k]);
    const cur = t.yours && level >= r.lo && level <= r.hi;
    return `<tr class="${done ? "done" : cur ? "cur" : ""}"><td>${r.lo === r.hi ? r.lo : `${r.lo}–${r.hi}`}</td>
      <td><b>${r.spend.map(([k, n]) => `${pretty(short(k))} +${n}`).join(", ")}</b></td>
      <td class="sub">${Object.entries(r.after).map(([k, v]) => `${pretty(short(k))} ${v}`).join(", ")}</td>
      <td>${done ? `<span class="verdict v-snipe">Done</span>` : cur ? `<span class="verdict v-pricey">Now</span>` : ""}</td></tr>`;
  }).join("");
  return win(`${esc(t.job)} SP, level by level`, `<div class="body">
      <table class="mobtable btable"><thead><tr><th>Level</th><th>Spend</th><th>Skills after it</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <p class="sub" style="margin:10px 0 0">From NiaDB’s <a href="https://${esc(t.source)}" target="_blank" rel="noopener">${esc(t.source.split("/").pop().replace(/-class-guide$/, "").replace(/-/g, " ").replace(/\b\w/g, c => c.toUpperCase()).replace("Fp", "F/P").replace("Il", "I/L"))} class guide</a>.${t.yours ? " Done means your skills in the game already reach that row; Now is your level." : ` You pick ${esc(t.job)} or another second job at level 30.`}</p></div>`);
}

// Skills: the game's skill window with a tab per job you have, the next three points beside it
let skillPick = null, skView = "skills", skillsKey = "", skJob = null;
async function renderSkills(quiet){
  // quiet: a refresh because the game showed a change; skipped while you edit your plan
  if (quiet && (planSave || document.activeElement === $("#plan"))) return;
  const d = await api("/api/skills"), plan = d.plan || {};
  if (tab !== "skills") return;
  const key = JSON.stringify([d, state.profile.level, state.profile.job, skView, skJob, skillPick]);
  if (quiet && key === skillsKey) return;
  skillsKey = key;
  if (!d.skills.length){ $("#view").innerHTML = `<div class="empty">No skills listed for ${esc(state.profile.job)} yet.</div>`; return; }
  const jobs = [...new Set(d.skills.map(s => s.job))];
  if (!jobs.includes(skJob)) skJob = jobs.includes(state.profile.job) ? state.profile.job : jobs[jobs.length - 1];
  const list = d.skills.filter(s => s.job === skJob);
  const s = list.find(x => x.id === skillPick) || d.skills.find(x => x.id === skillPick) || list[0];
  skillPick = s.id;
  const spent = list.reduce((a, x) => a + (d.now[x.name] || 0), 0), tier = (list[0].tier || "").replace(" Job", " job");
  const tabs = jobs.map(j => { const first = d.skills.find(x => x.job === j);
    return [j, `${first && first.img ? `<img src="${esc(first.img)}" alt="">` : ""}${esc(j)}`, j === skJob]; });
  const rows = list.map(x => { const n = d.now[x.name];
    return `<button class="skr${x.id === s.id ? " on" : ""}${n != null && n >= x.max ? " maxed" : ""}" data-skill="${esc(x.id)}">
      <span class="sic">${x.img ? `<img src="${esc(x.img)}" alt="">` : ""}</span>
      <span class="skn"><b>${pretty(x.name)}</b><small>${esc(x.kind)}</small><span class="skl"><i style="width:${n != null ? Math.round(n / x.max * 100) : 0}%"></i></span></span>
      <span class="skv"><b>${n ?? "–"}</b><span>/ ${x.max}</span></span></button>`; }).join("");
  const left = gameWin("SKILL INVENTORY", tabs, `<div class="gjob"><b>${esc(skJob)}</b><span>${esc(tier)} · ${spent} SP spent here</span></div>
      <div class="gbody">${rows}</div>`, "skwin");
  // the next three single points, then what the guide does after them
  const nx = d.next || {}, three = nx.sp3 || [], icon = name => (d.skills.find(x => x.name === name) || {}).img;
  const reached = {};
  three.forEach(x => { reached[x.skill] = x.to; });
  const then = (nx.sp || []).filter(r => r.to > (reached[r.skill] ?? r.from)).slice(0, 2).map(r => `${pretty(r.skill)} up to ${r.to}`);
  const ap = nx.ap || {};
  const nextCard = win(`${itemIcon(GI.skills, 22)} Your next 3 skill points`, `<div class="body nxg">
      ${three.length ? three.map((x, k) => `<div class="np"><em>${k + 1}</em>${icon(x.skill) ? `<img src="${esc(icon(x.skill))}" alt="">` : "<span></span>"}
        <b>${pretty(x.skill)}</b><span class="nv">${x.from} → ${x.to}</span></div>`).join("")
        : `<p class="sub" style="margin:0">${!(nx.sources || []).length ? "No guide plan for this job yet." : nx.known ? "You’ve reached the guide’s plan for your job." : "Open Skills (K) in the game so Companion knows your skill levels."}</p>`}
      <p class="sub" style="margin:4px 2px 0">${then.length ? `Then ${then.join(", then ")}. ` : ""}${d.sp ? `<b style="color:var(--good)">${d.sp} SP to spend now.</b> ` : ""}${ap.stat ? `AP: ${esc(ap.stat)}${ap.until ? ` until ${ap.until}` : ""}.` : ""}</p>
    </div>`, (nx.sources || []).length ? `NiaDB ${esc(skJob)} class guide` : "");
  const tables = nx.tables || [], table = tables.find(x => x.job === skView);
  const now = d.now[s.name];
  const detail = table ? buildTable(table, d.now, state.profile.level).replace('<div class="title">', `<div class="title"><button class="btn mini" id="skback">← Back</button>`)
    : win(`${s.img ? `<img class="gi" src="${esc(s.img)}" width="22" height="22" alt="">` : ""} ${pretty(s.name)}`, `<div class="body">
      <div class="skhead"><span class="sic big">${s.img ? `<img src="${esc(s.img)}" alt="">` : ""}</span>
        <div><div class="lvbig"><b>${now ?? "?"}</b> / ${s.max}</div><div class="sub">${now != null ? "your level in the game" : "open Skills (K) in the game"}</div></div>
        <div class="splan"><label class="sub" for="plan">Your plan</label><button class="btn small" data-step="-1" aria-label="One less">−</button>
          <input id="plan" type="number" min="0" max="${s.max}" value="${plan[s.id] || 0}"><button class="btn small" data-step="1" aria-label="One more">+</button></div></div>
      <p class="desc">${pretty(s.desc)}</p>
      <div class="cmp"><div><span>At level 1</span><p>${esc(s.first) || "?"}</p></div><div class="mx"><span>At max</span><p>${esc(s.maxed) || "?"}</p></div></div>
      ${tables.length ? `<div class="btns" style="margin:10px 0 0">${tables.map(x => `<button class="btn" data-v="${esc(x.job)}">See the ${esc(x.job)} build, level by level${x.yours ? "" : " (at 30)"}</button>`).join("")}</div>` : ""}
    </div>`, `${esc(s.kind)} · max ${s.max}`);
  $("#view").innerHTML = `<div class="skpage">${left}<div class="skside">${nextCard}<div class="skdetail">${detail}</div></div></div>`;
  document.querySelectorAll("#view [data-gtab]").forEach(b => b.addEventListener("click", () => { skJob = b.dataset.gtab; skillPick = null; skView = "skills"; renderSkills(); }));
  document.querySelectorAll("#view [data-skill]").forEach(b => b.addEventListener("click", () => { skillPick = b.dataset.skill; skView = "skills"; renderSkills(); }));
  document.querySelectorAll("#view [data-v]").forEach(b => b.addEventListener("click", () => { skView = b.dataset.v; renderSkills(); }));
  const back = $("#skback"); if (back) back.addEventListener("click", () => { skView = "skills"; renderSkills(); });
  const inp = $("#plan");
  if (!inp) return;
  const setPlan = v => {
    v = Math.max(0, Math.min(s.max, v || 0)); inp.value = v; plan[s.id] = v;
    clearTimeout(planSave); planSave = setTimeout(() => { planSave = null; api("/api/profile", {skill_plan: plan}); }, 400);
  };
  inp.addEventListener("input", () => setPlan(+inp.value));
  document.querySelectorAll("#view [data-step]").forEach(b => b.addEventListener("click", () => setPlan(+inp.value + +b.dataset.step)));
}

const VRANK = {snipe:0, npc:0, fair:1, pricey:2, over:3, split:4, check:4, info:5};
let seenFilter = "all", seenPick = null;

function priceRange(low, p25, median, p75){
  // where a price sits among recent sales: green quarter = snipe, then fair, pricey, overpriced
  if (!median || !p25 || !p75) return "";
  const lo = p25 * 0.6, hi = p75 * 1.4, at = Math.max(0, Math.min(100, (low - lo) / (hi - lo) * 100));
  return `<div class="range" role="img" aria-label="Where ${fmt(low)} sits among recent sales"><i style="left:${at}%"></i></div>
    <div class="ranges"><span><b class="src-msc">MSC</b> snipe up to ${money(p25)}</span><span>Middle ${money(median)}</span><span>Overpriced over ${money(p75)}</span></div>`;
}
function seenDetail(e){
  if (!e) return `<p class="sub" style="margin:10px 4px 0">Tap an item to see what it was listed at and what it’s worth.</p>`;
  const when = new Date(e.last_ts).toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  return `<article class="card" style="margin-top:12px"><div class="row">
      ${slot(e.img, 44)}
      <div class="grow"><h3>${pretty(e.name)}</h3><div class="sub">Seen ${e.seen} ${e.seen === 1 ? "time" : "times"}, last on ${esc(when)}${e.low_seller ? `. Cheapest at ${pretty(e.low_seller)}’s shop` : ""}</div></div>
      ${e.verdict ? `<span class="verdict v-${e.verdict}">${VLABEL[e.verdict]}</span>` : ""}</div>
    ${e.median || e.cozy ? `<div class="tag"><div class="buy"><span>Cheapest you saw</span><b>${money(e.low)}</b></div><div class="sell"><span>Recent sales</span><b class="srcpair">${srcPrice("MSC", e.median, "src-msc")}${srcPrice("Cozy", e.cozy, "src-cozy")}</b></div></div>
      ${priceRange(e.low, e.snipe, e.median, e.p75)}` : ""}
    <ul class="chips">
      ${e.npc ? `<li class="good">An NPC pays ${money(e.npc)}</li>` : ""}
      <li>Latest listing ${money(e.last)}</li>
      ${e.median || e.cozy ? "" : `<li class="warn">No market price for it yet</li>`}
    </ul></article>`;
}

async function renderFlips(){
  const all = await api("/api/seen");
  const verdicts = ["snipe", "npc", "fair", "pricey", "over", "split"];
  const pass = {all: () => true, deals: e => e.verdict === "snipe" || e.verdict === "npc",
                fair: e => e.verdict === "fair", over: e => e.verdict === "pricey" || e.verdict === "over",
                differ: e => e.verdict === "split", other: e => !verdicts.includes(e.verdict)};
  const items = all.filter(pass[seenFilter]).sort((a, b) => (VRANK[a.verdict] ?? 5) - (VRANK[b.verdict] ?? 5) || (a.last_ts < b.last_ts ? 1 : -1));
  // the first item opens by itself, so the detail is never an empty box
  const pick = all.find(e => e.name === seenPick) || items[0] || null;
  if (pick) seenPick = pick.name;
  const count = k => all.filter(pass[k]).length;
  const tiles = items.map(e => `<button class="islot" data-v="${e.verdict || ""}" data-name="${esc(e.name)}" aria-pressed="${e.name === seenPick}"
      title="${esc(e.name)}: cheapest ${money(e.low)}${e.median ? `, MSC ${money(e.median)}` : ""}${e.cozy ? `, Cozy ${money(e.cozy)}` : ""}" aria-label="${esc(e.name)}${e.verdict ? ", " + VLABEL[e.verdict] : ""}">
      ${e.img ? `<img src="${esc(e.img)}" alt="" loading="lazy" onerror="this.nextElementSibling.hidden=false;this.remove()">` : ""}
      <span class="noimg" ${e.img ? "hidden" : ""}>${pretty(e.name)}</span>
      <span class="qty">${e.seen}</span>${e.verdict ? `<span class="tagv" data-v="${e.verdict}"></span>` : ""}</button>`).join("");
  const mine = myShopCard((await api("/api/state")).myshop, true);
  const sk = sellKeepCard(await api("/api/sellkeep"));
  $("#view").innerHTML = `${mine}${sk}<p class="note">Items you passed in player shops, cheapest price against <span class="src-msc">MSC</span> and <span class="src-cozy">Cozy</span>. A verdict shows only when both agree. <span class="asof">${pricesAsOf()}</span></p>
    ${all.length ? `<div class="md"><div class="master" style="padding:0;background:none;border:0;box-shadow:none">
        <div class="filters" role="group" aria-label="Show">${[["all","All",""],["deals","Deals","snipe"],["fair","Fair","fair"],["over","Too pricey","over"],["differ","Differ","split"],["other","Other","info"]].map(([k, t, v]) =>
        `<button data-f="${k}" aria-pressed="${seenFilter === k}">${v ? `<span class="tagv" data-v="${v}"></span>` : ""}${t} ${count(k)}</button>`).join("")}</div>
      <div class="inv">${tiles || `<span class="sub" style="grid-column:1/-1;padding:8px">Nothing in this group.</span>`}</div></div>
      <div class="detail">${seenDetail(pick)}</div></div>`
    : `<div class="empty">Nothing yet. With screen reading on, open player shops in the Free Market: every item Companion reads lands here with its picture and what it’s worth.</div>`}`;
  document.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => { seenFilter = b.dataset.f; renderFlips(); }));
  document.querySelectorAll("[data-star]").forEach(b => b.addEventListener("click", async () => {
    await api("/api/star", {name:b.dataset.star, on:b.getAttribute("aria-pressed") !== "true"}); renderFlips();
  }));
  const skc = $("#sk-clear"); if (skc) skc.addEventListener("click", async () => { await api("/api/sellkeep/clear", {}); renderFlips(); });
  const ok = $("#away-ok"); if (ok) ok.addEventListener("click", async () => { await api("/api/myshop/seen", {}); renderFlips(); });
  document.querySelectorAll(".islot").forEach(b => b.addEventListener("click", () => { seenPick = b.dataset.name; renderFlips(); }));
  fitPanes();
}

// Fit the list and details panes to the window, so the page itself doesn't scroll
function fitPanes(){
  document.querySelectorAll(".md .master, .md .detail").forEach(el => {
    el.style.maxHeight = innerWidth > 820 ? Math.max(260, innerHeight - el.getBoundingClientRect().top - scrollY - 16) + "px" : "";
  });
}
addEventListener("resize", fitPanes);

let renderSeq = 0;
async function render(){
  clearInterval(timer);
  const seq = ++renderSeq;
  document.querySelector(".foot").hidden = tab !== "settings";
  hideTip();
  if (FULL.has(tab)) document.body.dataset.full = ""; else delete document.body.dataset.full;
  try{
    if (tab === "live"){ liveKey = ""; await renderLive(); if (seq === renderSeq) timer = setInterval(renderLive, 1000); }
    else if (tab === "nav"){ navKey = ""; await renderNav(true); if (seq === renderSeq) timer = setInterval(() => renderNav(false), 2000); }
    else if (tab === "train") await renderTrain();
    else if (tab === "quests") await renderQuests();
    else if (tab === "settings") await renderSettings();
    else if (tab === "gear") await renderGear();
    else if (tab === "skills") await renderSkills();
    else await renderFlips();
  }catch(e){
    $("#view").innerHTML = `<div class="empty">Can’t reach Companion. Check that it’s still running.</div>`;
  }
}

// Follow the character: when the game shows a new level, job, mesos or map, refresh.

    if (prev !== null && prev !== profRev){
      fillProfile(state.profile);
      if (tab === "skills") renderSkills(true);
      else if (!["live","nav"].includes(tab)) render();
    }
  }catch(e){}
}, 4000);

};
const setupDlg = $("#setup");
let setupStep = 0, setupTimer = null;
const he = s => `<bdi>${s}</bdi>`;
function setupChar(c, p){
  const cz = state.cozy || {};
  return `<h2>ברוכים הבאים ל-${he("Companion")}</h2>
    <p>עוזר חינמי ל-${he("MapleStory Classic")} שרץ רק על המחשב שלכם: איפה לגריינד, קווסטים, ציוד, סקילים, מסלולים בין מפות, ומחירי שוק מ-${he("MSC")} ומ-${he("Cozy Market")}.</p>
    <h3>הדמות שלכם</h3>
    <div class="grid2"><div><label class="sub" for="su-job">ג'וב</label><select id="su-job" dir="ltr">${state.jobs.map(j => `<option${j === p.job ? " selected" : ""}>${esc(j)}</option>`).join("")}</select></div>
      <div><label class="sub" for="su-level">רמה</label><input id="su-level" type="number" min="1" max="200" dir="ltr" value="${p.level}"></div></div>
    <p class="sub" style="margin-top:8px">כשקריאת המסך פועלת, ${he("Companion")} מעדכן לבד את הרמה, הג'וב, ה-mesos והמפה מתוך המשחק.</p>
    <div class="checks">
      <div class="check ${state.prices && state.prices !== "?" ? "ok" : "warn"}">מחירי ${he("MSC")}: ${state.prices && state.prices !== "?" ? "נטענו" : "עוד לא נטענו, בדקו את החיבור לאינטרנט"}</div>
      <div class="check ${cz.items ? "ok" : "warn"}">מחירי ${he("Cozy Market")}: ${cz.items ? `${he(fmt(cz.items))} אייטמים, מתעדכנים לבד כל שעתיים` : "נטענים ברקע: הראשונים תוך דקה, כולם תוך כחצי שעה"}</div>
    </div>`;
}
function setupChecks(c){
  if (!c.screen_reading) return "";
  const size = c.game_size, rows = [];
  rows.push(c.game_found ? `<div class="check ok">חלון המשחק נמצא${size ? `: ${he(size[0] + "×" + size[1])}` : ""}</div>`
    : `<div class="check warn">לא נמצא חלון עם ${he(esc(c.game_title))} בכותרת. פתחו את המשחק, הבדיקה מתעדכנת לבד.</div>`);
  const min = state.min_height || 1000;
  if (c.game_found && size) rows.push(size[1] >= min ? `<div class="check ok">רזולוציה טובה לקריאה${size[1] >= 1200 ? "" : `. הכי מדויק: ${he("1920×1200")}`}</div>`
    : `<div class="check warn">החלון קטן מדי: הקריאה עוצרת עד שהמשחק יהיה ${he("1920×1080")} או גדול יותר</div>`);
  return rows.join("");
}
function setupScreen(c){
  if (!c.screen_available) return `<h2>קריאת מסך</h2><p>קריאת מסך עובדת רק בגרסה ל-${he("Windows")}. כל השאר עובד גם בלעדיה.</p>`;
  return `<h2>קריאת מסך (לא חובה)</h2>
    <p>בלי קריאת מסך כל הדשבורד עובד, ושום דבר לא נוגע במשחק. עם קריאת מסך ${he("Companion")} מסתכל על חלון המשחק, כמו שיתוף חלון ב-${he("Discord")} או ב-${he("OBS")}. הוא לא נוגע בזיכרון המשחק, לא לוחץ על מקשים ולא שולח את המסך לשום מקום. ככה הוא:</p>
    <ul><li>מראה מחיר מתחת לכל אייטם שעוברים עליו עם העכבר, ותוויות מחיר ליד חנויות של שחקנים</li>
      <li>מראה מתחת למיני-מפה לאיזה פורטל ללכת</li>
      <li>מעדכן לבד רמה, מפה, סקילים וקווסטים</li></ul>
    <p class="risk">זה כלי לא רשמי ש-${he("Nexon")} לא אישרה. התנאים של ${he("Nexon")} אוסרים תוכנות צד שלישי לא מורשות, ואין שום הבטחה שלא תהיה חסימה. חסימה חלה גם על ${he("Classic World")} וגם על ${he("MapleStory")} הרגיל. שחקנים דיווחו על ${he("Lie Detector")} בזמן שימוש בכלים שקוראים את המסך, ולא ידוע אם יש קשר. הפעילו רק אם אתם מקבלים את הסיכון.</p>
    <label class="toggle"><input type="checkbox" id="su-consent" ${c.consent ? "checked" : ""}> הבנתי את הסיכון, והשימוש על אחריותי</label>
    <label class="toggle"><input type="checkbox" id="su-reading" ${c.screen_reading ? "checked" : ""} ${c.consent ? "" : "disabled"}> להפעיל קריאת מסך</label>
    <label class="toggle"><input type="checkbox" id="su-drawing" ${c.draw_overlay ? "checked" : ""} ${c.screen_reading ? "" : "disabled"}> להציג גם על המשחק: מחירים, ומסלול מתחת למיני-מפה</label>
    <div class="checks" id="su-checks" role="status">${setupChecks(c)}</div>`;
}
function setupHowTo(){
  const slotI = k => `<span class="slot hslot" aria-hidden="true"><img src="${ICON[k]}" alt=""></span>`;
  const tag = (v, t, he) => `<span class="tagline"><span class="verdict v-${v}">${t}</span>${he}</span>`;
  const tile = (k, name, text) => `<div class="htile">${slotI(k)}<div><b class="tabname" dir="ltr">${name}</b><span>${text}</span></div></div>`;
  return `<h2>איך משתמשים</h2>
    <h3>על המשחק</h3>
    <div class="hows">
      <div class="how">${slotI("mesos")}<div><b>מחירים</b>
        <p>עברו עם העכבר על אייטם ותראו מתחתיו את המחיר ב-<bdi class="src src-msc">MSC</bdi> וב-<bdi class="src src-cozy">Cozy</bdi>.</p>
        <div class="tags"><span>בחנויות:</span>${tag("snipe", "SNIPE", "זול")}${tag("fair", "FAIR", "הוגן")}${tag("pricey", "PRICEY", "יקר")}${tag("over", "OVERPRICED", "יקר מדי")}</div>
        <small>רק כששני האתרים מסכימים. אחרת ${he("SOURCES DIFFER")}, ותחליטו לבד.</small></div></div>
      <div class="how">${slotI("scroll")}<div><b>מסלול</b>
        <p>בחרו יעד ב-${he("Go to")} או ${he("Take me there")} ב-${he("Train")}. מתחת למיני-מפה: החץ מראה לאיזה פורטל, הקווים כמה מעברים נשארו. מתקדם לבד.</p></div></div>
      <div class="how">${slotI("shell")}<div><b>קווסט</b>
        <p>${he("Guide me in game")} ב-${he("Quests")} מוסיף לפס מה עושים עכשיו, עד המפלצות ובחזרה <span class="nw">ל-NPC</span>. הספירה ב-${he("Quest Helper")} של המשחק.</p></div></div>
    </div>
    <h3>בדשבורד</h3>
    <div class="htiles">
      ${tile("leaf", "Now", "מה עכשיו: מסלול, חנות, SP ו-AP")}
      ${tile("mush", "Train", "המפות הכי טובות לרמה שלכם")}
      ${tile("shell", "Quests", "מה אפשר לקחת ומה בתהליך")}
      ${tile("gloves", "Gear", "הציוד הכי טוב ומחיר טוב לקנייה")}
      ${tile("rock", "Skills", "לאן הולכות הנקודות")}
      ${tile("mesos", "Shops", "כל אייטם שראיתם בחנויות")}
    </div>
    <h3>כדי שהקריאה תעבוד טוב</h3>
    <ul class="tips">
      <li><span class="keys" dir="ltr"><kbd>S</kbd><kbd>K</kbd><kbd>Q</kbd></span><span>פתחו פעם אחת ${he("Character Stat")}, ${he("Skills")} ו-${he("Quest")}. ככה ${he("Companion")} לומד את הרמה, הסקילים והקווסטים שסיימתם.</span></li>
      <li><span class="keys" dir="ltr"><kbd class="wide">1920×1080</kbd></span><span>הרזולוציה הכי קטנה שהקריאה עובדת בה. ${he("1920×1200")} הכי מדויק. בפחות מזה הקריאה עוצרת.</span></li>
      <li><span class="keys" dir="ltr"><kbd>?</kbd></span><span>פותח את ההסבר הזה שוב, מכל לשונית.</span></li>
    </ul>`;
}
const SETUP = [setupChar, setupScreen, setupHowTo];

async function openSetup(step){
  setupStep = step || 0;
  if (!setupDlg.open) setupDlg.showModal();
  await drawSetup();
}
async function drawSetup(){
  clearInterval(setupTimer);
  const c = await api("/api/settings"), p = state.profile, last = setupStep === SETUP.length - 1;
  $("#setup-dots").innerHTML = SETUP.map((_, i) => `<i class="${i <= setupStep ? "on" : ""}"></i>`).join("");
  $("#setup-body").innerHTML = SETUP[setupStep](c, p);
  $("#setup-body").scrollTop = 0;
  $("#setup-foot").innerHTML = `${setupStep ? `<button class="btn" id="su-back">הקודם</button>` : `<button class="btn" id="su-skip">דלגו</button>`}
    <span class="grow sub">שלב ${setupStep + 1} מתוך ${SETUP.length}</span>
    <button class="btn primary" id="su-next">${last ? "יאללה, למשחק" : "הבא"}</button>`;
  const back = $("#su-back"); if (back) back.addEventListener("click", () => { setupStep--; drawSetup(); });
  const skip = $("#su-skip"); if (skip) skip.addEventListener("click", () => setupDlg.close());
  $("#su-next").addEventListener("click", () => { if (last) setupDlg.close(); else { setupStep++; drawSetup(); } });
  const saveChar = async () => {
    await api("/api/profile", {job:$("#su-job").value, level:+$("#su-level").value || 1});
    await loadState(); fillProfile(state.profile);
  };
  const job = $("#su-job"); if (job){ job.addEventListener("change", saveChar); $("#su-level").addEventListener("change", saveChar); }
  const set = async body => { const r = await api("/api/settings", body); if (r.error) alert(r.error); await loadState(); drawSetup(); };
  const con = $("#su-consent");
  if (con){
    con.addEventListener("change", e => set(e.target.checked ? {consent:true} : {consent:false, screen_reading:false, draw_overlay:false}));
    // drawing on the game is what most of it is for, so it comes on with reading; untick it to keep it off
    $("#su-reading").addEventListener("change", e => set(e.target.checked ? {screen_reading:true, draw_overlay:true} : {screen_reading:false}));
    $("#su-drawing").addEventListener("change", e => set({draw_overlay:e.target.checked}));
    if (c.screen_reading) setupTimer = setInterval(async () => {
      const box = $("#su-checks"); if (!box) return;
      box.innerHTML = setupChecks(await api("/api/settings"));
    }, 1500);
  }
}
// closing it any way (finish, skip, Esc) counts as done; the ? button brings the how-to back
setupDlg.addEventListener("close", async () => {
  clearInterval(setupTimer);
  try{ await api("/api/settings", {setup_done:true}); }catch(e){}
  liveKey = ""; render();
});
$("#help").addEventListener("click", () => openSetup(2));

loadState().then(async s => {
  profRev = s.profile.rev; fillProfile(s.profile);
  render();
  const c = await api("/api/settings");
  if (!c.setup_done) openSetup(0);
}).catch(() => {
  $("#view").innerHTML = `<div class="empty">Can’t reach Companion. Check that it’s still running, then reload this page.</div>`;
});
</script>
</body>
</html>
